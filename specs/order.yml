paths:
  /api/v1/orders/quote:
    post:
      tags: [orders-cart]
      operationId: orders_upsertQuote
      summary: Create or update a quote (cart and fare estimate)
      description: |
        Prices the cart and returns a quotation. Call this before POST /api/v1/orders/create.
        Pass `quotation_id` to update an existing quote. Promo errors block quote creation (4xx).
        Available promos are returned by GET /api/v1/orders/quote/{id}, not here.

        Partial-update caveat: when outlet, coordinates, customer, payment_via, delivery_mode and the item-id set match the last full
        pricing pass, the server reuses the last delivery charge, surge and schedule. A closed outlet or a fee change will not show up
        until a request that changes one of those fields, or POST /api/v1/orders/create, which always re-validates.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XTimezone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              deliver_now_cash:
                summary: Home delivery, now, cash on delivery (delivery_mode 1, order_mode 2, payment_via 1)
                value:
                  address: Synthetic Street 1, Testville
                  customer_id: 00000000-0000-4000-8000-000000000001
                  delivery_mode: 1
                  items:
                    - entity_type: 1
                      item_id: 00000000-0000-4000-8000-000000000003
                      menu_id: 00000000-0000-4000-8000-000000000004
                      notes: ""
                      quantity: 2
                      unit_price: 250
                  latitude: 12.9716
                  longitude: 77.5946
                  order_mode: 2
                  outlet_id: 00000000-0000-4000-8000-000000000002
                  payment_via: 1
                  timezone: Asia/Kolkata
              deliver_scheduled_cash:
                summary: Home delivery, scheduled (order_mode 1 + scheduled_for), cash
                value:
                  address: Synthetic Street 1, Testville
                  customer_id: 00000000-0000-4000-8000-000000000001
                  delivery_mode: 1
                  items:
                    - entity_type: 1
                      item_id: 00000000-0000-4000-8000-000000000003
                      menu_id: 00000000-0000-4000-8000-000000000004
                      notes: ""
                      quantity: 2
                      unit_price: 250
                  latitude: 12.9716
                  longitude: 77.5946
                  order_mode: 1
                  outlet_id: 00000000-0000-4000-8000-000000000002
                  payment_via: 1
                  scheduled_for: "2026-12-06T13:30:00Z"
                  timezone: Asia/Kolkata
              pickup_now_card:
                summary: Pickup, now, card (delivery_mode 2, order_mode 2, payment_via 2)
                value:
                  address: Synthetic Street 1, Testville
                  customer_id: 00000000-0000-4000-8000-000000000001
                  delivery_mode: 2
                  items:
                    - entity_type: 1
                      item_id: 00000000-0000-4000-8000-000000000003
                      menu_id: 00000000-0000-4000-8000-000000000004
                      notes: ""
                      quantity: 2
                      unit_price: 250
                  latitude: 12.9716
                  longitude: 77.5946
                  order_mode: 2
                  outlet_id: 00000000-0000-4000-8000-000000000002
                  payment_via: 2
                  timezone: Asia/Kolkata
      responses:
        '200':
          description: Quote created or updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request, a quote item is invalid, or a promo is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quotation not found (when quotation_id is set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/quote/{id}:
    parameters:
      - $ref: '#/components/parameters/QuotationIdPath'
    get:
      tags: [orders-cart]
      operationId: orders_getQuote
      summary: Get a quote with its breakdown and available promos
      description: |
        Call after POST /api/v1/orders/quote. Returns the full breakdown.
        If the original promo has expired, the discount is removed and the totals are recalculated. Always check the values.
        The caller must own the quote. A merchant or admin reading a customer's quote passes `customer_id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XTimezone'
        - $ref: '#/components/parameters/CustomerQuery'
      responses:
        '200':
          description: Quote returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quote not found or expired (QUOTE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [orders-cart]
      operationId: orders_deleteQuote
      summary: Delete a quote permanently
      description: Discards a quotation. Call it to abandon a cart. A quote that has been ordered is not affected here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/CustomerQuery'
      responses:
        '200':
          description: Quote deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "quotation deleted permanently"
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quote not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/create:
    post:
      tags: [orders-checkout]
      operationId: orders_createOrder
      summary: Place an order from a quotation
      description: |
        Call after POST /api/v1/orders/quote, and only after the quote's payment mode and delivery mode are set.
        The quote is cached for 30 minutes. After that this call returns 404 QUOTE_NOT_FOUND.
        The service re-validates outlet, items, prices, delivery and promo at this point.

        Idempotency: there is no Idempotency-Key header. Use the `client_request_id` body field. A retry with the same value
        and the same customer returns the original order with HTTP 200 and the same body.
        A value already used by a different customer in the same tenant returns 400 INVALID_INPUT (duplicate request).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/XTimezone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              create_from_quote:
                summary: 'Create the order from a quote: quotation_id from the quote response, a new client_request_id per order'
                value:
                  client_request_id: synthetic-request-0001
                  customer_id: 00000000-0000-4000-8000-000000000001
                  quotation_id: 00000000-0000-4000-8000-000000000005
      responses:
        '200':
          description: Order created, or the original order replayed for a repeated client_request_id.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Invalid request, a missing payment or delivery mode, a scheduled time that is no longer valid, or a duplicate client_request_id from another customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Quotation not found or expired (QUOTE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Duplicate create (DUPLICATE_ENTRY). x-todo: the code maps a lost race to INVALID_INPUT; confirm which status clients see."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business rule failed (for example, an item is unavailable or the outlet is closed or out of range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/list:
    post:
      tags: [orders-order]
      operationId: orders_listOrders
      summary: List orders (offset pagination)
      description: |
        Offset pagination: offset = (current_page - 1) * limit. Limit is clamped to 1..100 and current_page to 1..10000.
        Default ordering is order_id DESC. Response `meta` includes `total_count`, `filters`, `statuses`, and `payout_status`
        when `filters.is_want_payout` is true.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderListRequest'
            example:
              current_page: 1
              limit: 20
              sort:
                sort_by: order_id
                sort_order: 1
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderResp'
                          order_count:
                            type: object
                            additionalProperties:
                              type: integer
                            description: Count per status name.
                      meta:
                        type: object
                        properties:
                          total_count:
                            type: integer
                          filters:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          statuses:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
                          payout_status:
                            type: array
                            items:
                              type: object
                              additionalProperties: true
        '400':
          description: Invalid request (search_text without search_fields, unknown search field, or min_amount greater than max_amount).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    get:
      tags: [orders-order]
      operationId: orders_getOrderDetail
      summary: Get order detail
      description: |
        Returns the order. Use `field` to pick sections (order, item, price, commission, rating, cancellation); omit it for all.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/DetailField'
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied (ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [orders-order]
      operationId: orders_updateOrderStatus
      summary: Update order status (store moves stages to Delivered; customer cancels)
      description: |-
        Moves an order to a new status. The same call serves the store and the customer; the token's role decides who is acting.

        **Store (merchant role "2", outlet user "101", or staff)** moves the order through its stages, one call per stage, in this order (the store app offers the next one each time):
        2 Accepted → 3 Assigned → 4 Processed → 5 Order ready → 6 Picked up → 7 Dispatched → 8 Delivered.
        - On accept (2) the store may send `metadata.prep_time` (minutes).
        - To reject or cancel, send 9 with `metadata.reason`.
        - An order that is Delivered (8) or Cancelled (9) is final.

        **Customer (role "4")** only cancels: send 9 with `metadata.reason`, on their own order. A customer cannot cancel a cash-on-delivery order (the store cancels it), and cannot cancel once the order is dispatched (7).

        The `{id}` is the order's UUID (`order.id` in the create response) or its number (`order.order_id`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
            examples:
              customer_cancel:
                summary: 'Customer: cancel own card or wallet order (9) with a reason'
                value:
                  metadata:
                    reason: Changed my mind
                    refund_method: Source
                  status: 9
              store_1_accept:
                summary: 'Store step 1: accept (2), with prep time in minutes'
                value:
                  metadata:
                    prep_time: 20
                  status: 2
              store_2_assigned:
                summary: 'Store step 2: assigned (3)'
                value:
                  status: 3
              store_3_processed:
                summary: 'Store step 3: processed (4)'
                value:
                  status: 4
              store_4_ready:
                summary: 'Store step 4: order ready (5)'
                value:
                  status: 5
              store_5_picked_up:
                summary: 'Store step 5: picked up (6)'
                value:
                  status: 6
              store_6_dispatched:
                summary: 'Store step 6: dispatched (7)'
                value:
                  status: 7
              store_7_delivered:
                summary: 'Store step 7: delivered (8)'
                value:
                  status: 8
              store_reject:
                summary: 'Store: reject or cancel (9) with a reason'
                value:
                  metadata:
                    reason: Item out of stock
                  status: 9
      responses:
        '200':
          description: Order cancelled (or status unchanged).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order_id:
                            type: string
        '400':
          description: Missing cancel reason (MISSING_REQUIRED_FIELD), invalid status, or cash-on-delivery order (INVALID_INPUT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business rule failed (ORDER_CANNOT_BE_CANCELLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Internal error. Also returned when the order is past DISPATCHED (x-todo: the code returns INTERNAL_ERROR for this case, which looks unintended; confirm before publishing)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}/cancellation-preview:
