openapi: 3.0.1
info:
  title: Dhaam Profile Service API
  version: 1.0.0
  description: >-
    Outlet setup calls of the profile service, served under /api/v1/profile. Only the calls used to make a
    store's outlet orderable (hours and delivery basics) are documented here. Settings,
    managers, reviews, templates, favourites and internal routes are out of scope for this file.
    Auth: send `Authorization: Bearer {{token}}` on each operation that needs it.
    Language: this service reads the lang query parameter (default en), not Accept-Language.
    Ordering: create the store with POST /api/v1/users/store/register (user-profile spec) first, then add outlets (POST /api/v1/profile/outlets) for it,
    then adjust outlet hours and delivery with PUT /api/v1/profile/outlets/{id}. Store login is not on this service; see the user-profile spec.
    Errors: the envelope is {success: false, error: {type, message, details}, meta}.
    Pagination: none on these calls. Idempotency: none.
    Hours: an outlet's opening hours are the delivery_schedules and pickup_schedules lists, written here and
    read back by GET /api/v1/users/outlets/{id} (user-profile spec). Each row is one open window for one day.
    Source: dh-profile live (4b9f6586). Routes are mounted at the root, with no /api/v1 prefix in code.
  x-source-commit: 4b9f6586 (dh-profile live)
servers:
  - url: "{{baseUrl}}"
tags:
  - name: profile-outlets
    description: Outlet creation, hours and delivery basics for a store.
paths:
  /api/v1/profile/outlets:
    post:
      tags:
        - profile-outlets
      operationId: profile_addOutlet
      summary: Add an outlet to a store
      description: >-
        Adds an outlet to a store with its location, delivery schedules (hours), pickup schedules and delivery basics.
        Requires a Bearer token. Schedules are optional here; send them to set the opening hours. The response
        confirms creation and does not return the new outlet id. Use the store id of the store to make orderable. Settings in the same request body (order settings,
        notification settings, business settings, delivery surge, holiday overrides and region ids) are out of scope
        and not documented here.
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: false
          description: Response language. Defaults to en.
          schema:
            type: string
            example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletRequest"
            example:
              outlet_name: Test Outlet
              store_id: "1001"
              location_address: 1 Example Plaza, Testville
              latitude: 12.9716
              longitude: 77.5946
              is_pickup_timing: false
              delivery_schedules:
                - day_of_week: 1
                  slot_number: 1
                  open_time: "09:00"
                  close_time: "21:00"
                  is_closed: false
                  schedule_type: 1
                  is_active: true
              delivery:
                - delivery_managed_by: 1
                  is_default: true
                  delivery_settings:
                    delivery_managed_by: 1
                    delivery_time_minutes: 30
                    delivery_charge_type: flat
                    delivery_charge: 20
      responses:
        "200":
          description: Outlet created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: Created
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The new outlet id is not returned; read it back by listing outlets for the store, which this file does not
        document. Required fields are not confirmed: the request struct has no validate tags, so the minimum set is
        not known. Delivery provider keys (api_key_charge, api_key_timing) are excluded from the example and the
        schema on purpose. Only basic outlet fields are documented here.
  /api/v1/profile/outlets/{id}:
    put:
      tags:
        - profile-outlets
      operationId: profile_updateOutlet
      summary: Update an outlet's details, hours and delivery basics
      description: >-
        Updates an outlet. Send only the fields to change; every field is optional. Requires a Bearer token.
        Hours replace by mode: sending delivery_schedules replaces the delivery rows (delivery_mode 1) and sending
        pickup_schedules replaces the pickup rows (delivery_mode 2). A list that is omitted or empty leaves that mode's
        rows as they are. Settings in the same request body (order settings, notification settings, business settings,
        delivery surge, holiday overrides and region ids) are out of scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Outlet UUID (outlet_uuid).
          schema:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000010
        - name: lang
          in: query
          required: false
          description: Response language. Defaults to en.
          schema:
            type: string
            example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletRequest"
            example:
              outlet_name: Test Outlet Updated
              delivery_schedules:
                - day_of_week: 1
                  slot_number: 1
                  open_time: "10:00"
                  close_time: "22:00"
                  is_closed: false
                  schedule_type: 1
                  is_active: true
      responses:
        "200":
          description: Outlet updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: Updated
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The handler returns 400 when the outlet id is empty. Not-found and cross-tenant error types are not verified; the
        usecase returns them. The EditOutletRequest fields are all optional, so the minimum body is not fixed here.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Internal error. The message is masked; no details are returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        request_id:
          type: string
          example: 00000000-0000-4000-8000-000000000002
    ErrorDetail:
      type: object
      properties:
        type:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Invalid request body
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    OutletRequest:
      type: object
      description: >-
        Outlet fields for create and update. Only the basic fields are documented: name, store, location, hours
        (schedules) and delivery basics. Other fields in the same JSON body are settings and are out of scope.
      properties:
        outlet_name:
          type: string
          example: Test Outlet
        description:
          type: string
          example: Synthetic outlet for test data
        store_id:
          type: string
          description: Store id of the store to make orderable.
          example: "1001"
        location_address:
          type: string
          example: 1 Example Plaza, Testville
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946
        is_pickup_timing:
          type: boolean
          example: false
        delivery_schedules:
          type: array
          description: Delivery hours (delivery_mode 1 rows). On update, a non-empty list replaces the delivery rows.
          items:
            $ref: "#/components/schemas/OutletSchedule"
        pickup_schedules:
          type: array
          description: Pickup hours (delivery_mode 2 rows). On update, a non-empty list replaces the pickup rows.
          items:
            $ref: "#/components/schemas/OutletSchedule"
        delivery:
          type: array
          description: Delivery basics (who delivers, default, time and charge).
          items:
            $ref: "#/components/schemas/DeliveryManagedItem"
    OutletSchedule:
      type: object
      description: >-
        One open window for one day. A day with several windows has one row per window (slot_number 1, 2, ...).
        A day with no rows is closed. A closed day can be sent as one row with is_closed true.
      required:
        - day_of_week
      properties:
        day_of_week:
          type: integer
          description: ISO weekday, 1 is Monday and 7 is Sunday.
          minimum: 1
          maximum: 7
          example: 1
        slot_number:
          type: integer
          description: Position of the window within the day, starting at 1.
          example: 1
        open_time:
          type: string
          description: Window start, HH:MM (24-hour). Stored as a time; read back as HH:MM:SS.
          example: "09:00"
        close_time:
          type: string
          description: Window end, HH:MM (24-hour). A close time earlier than the open time spans midnight.
          example: "21:00"
        is_closed:
          type: boolean
          description: True marks the day closed for this row.
          example: false
        schedule_type:
          type: integer
          description: Schedule kind. 1 is regular, the only value defined in the code reviewed.
          example: 1
        delivery_mode:
          type: integer
          description: 1 is delivery, 2 is pickup. If omitted, the list it is sent in sets the default (delivery_schedules 1, pickup_schedules 2).
          enum: [1, 2]
          example: 1
        holiday_id:
          type: integer
          format: int64
          description: Optional holiday ID for a holiday-specific window. 0 or omitted means a regular window.
          example: 0
        effective_date:
          type: string
          format: date
          description: YYYY-MM-DD. Optional start date of the window.
          example: '2027-01-01'
        expiry_date:
          type: string
          format: date
          description: YYYY-MM-DD. Optional end date of the window.
          example: '2027-12-31'
        is_active:
          type: boolean
          example: true
    DeliveryManagedItem:
      type: object
      properties:
        delivery_managed_by:
          type: integer
          description: Who manages delivery. Enum values are not confirmed.
          example: 1
        is_default:
          type: boolean
          example: true
        delivery_settings:
          $ref: "#/components/schemas/DeliveryBasics"
    DeliveryBasics:
      type: object
      description: The delivery fields that make an outlet deliverable. Other delivery fields are out of scope.
      properties:
        delivery_managed_by:
          type: integer
          example: 1
        delivery_time_minutes:
          type: integer
          example: 30
        delivery_charge_type:
          type: string
          example: flat
        delivery_charge:
          type: number
          format: double
          example: 20
        delivery_timing_type:
          type: string
