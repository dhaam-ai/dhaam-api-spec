openapi: 3.0.1
info:
  title: Dhaam User Profile Service API
  version: 1.0.0
  description: >-
    Customer profile, customer addresses, customer login and OTP, and the store (merchant) login and
    store setup calls used for admin test data. Served under /api/v1/users. Only routes that the customer
    app calls, plus the store calls needed for admin setup, are documented here.
    Auth: operations marked security [] need no token. All other operations need `Authorization: Bearer {{token}}`.
    Language: Accept-Language en (default) or es, read by the handlers.
    Ordering: call POST /otp/initiate first, then POST /otp/verify/{otptype} with the session and username
    it returns (see x-todo on the initiate operation). Customer addresses: create, then update or delete by
    address id.
    Errors: the envelope is {success: false, error: {type, message, details}, meta}. Rate-limited routes
    return 429 with {error: rate_limit_exceeded, message, retry_after} and a Retry-After header.
    Pagination: none on these routes. Idempotency: none.
    Source: dh-user-profile development (5a6e9d57). Customer app calls checked against live (b9fa15e). Outlet read (GET /api/v1/users/outlets/{id}) checked against live (b637d0ca).
  x-source-commit: 5a6e9d57 (dh-user-profile development)
servers:
  - url: "{{baseUrl}}"
tags:
  - name: users-customer-profile
    description: Customer profile read and update.
  - name: users-customer-addresses
    description: Customer addresses (create, list, update, delete, undo delete).
  - name: users-contact-change
    description: Change and verify the customer email or phone with an OTP.
  - name: users-otp
    description: OTP initiate and verify (signup, login, password change).
  - name: users-customer-login
    description: Customer login, logout and password reset.
  - name: users-store-setup
    description: Store login, store registration and store info, used for admin test-data setup.
  - name: users-outlet-hours
    description: Outlet read with its opening hours (delivery and pickup schedules).
paths:
  /api/v1/users/customer/{id}:
    get:
      tags:
        - users-customer-profile
      operationId: users_getCustomerProfile
      summary: Get a customer profile
      description: >-
        Returns the profile of the customer with the given numeric user id. Requires a Bearer token.
        The customer app calls this with its numeric user id from local storage.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric customer user id.
          schema:
            type: integer
            format: int64
            example: 1001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CustomerProfile"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The customer app (authService.ts) also calls GET /api/v1/users/customer/info?user_id=. No route matches
        it: /customer/info resolves to this operation with id set to info. Confirm with the app team; do not
        document that call as a route.
  /api/v1/users/customer/info:
    put:
      tags:
        - users-customer-profile
      operationId: users_updateCustomerProfile
      summary: Update the customer's own profile
      description: >-
        Updates the caller's own profile (full name, username, referral code, avatar, template fields). For a
        non-admin caller, customer_id must be empty or equal to the caller's own id, or the call returns 401.
        The customer app sends full_name and avatar_url here. Call after login.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              full_name: Test Customer
              avatar_url: https://cdn.example.com/avatars/test-customer.png
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: Response is the domain TenantProfile struct. Its JSON fields are not listed here; confirm before documenting them.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The customer app's updateProfile sends profile_picture and identifier, and registerCustomer (authService.ts)
        sends this same route with mobile, email, referral_code and device_info. UpdateProfileRequest has none of
        those fields (it has avatar_url and referal_code, spelled as in the code). Unknown fields are ignored by
        the bind, so those values are dropped. Confirm the intended contract with the app team.
  /api/v1/users/customer/add-address:
    post:
      tags:
        - users-customer-addresses
      operationId: users_addCustomerAddress
      summary: Add a customer address
      description: >-
        Creates an address for the caller. Requires address_line_1, city and country. Latitude and longitude
        are stored as sent (no range check in the validator).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreateRequest"
            example:
              label: Home
              address_line_1: 12 Example Street
              address_line_2: Near Test Park
              city: Testville
              state: Test State
              postal_code: "560001"
              country: India
              latitude: 12.9716
              longitude: 77.5946
              is_default: true
              receiver_name: Test Customer
              receiver_mobile: "5550100123"
              delivery_note_text: Ring the bell
      responses:
        "200":
          description: Address created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AddAddressResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The response echoes the input fields and does not return the new address id. The customer app's createAddress
        reads result.data.address, which the backend never sends. Confirm whether the id should be returned.
        The app also sends floor and landmark, which AddressReq does not have (ignored). The body user_id is
  /api/v1/users/customer/addresses:
    get:
      tags:
        - users-customer-addresses
      operationId: users_listCustomerAddresses
      summary: List the caller's addresses
      description: >-
        Returns the caller's addresses. A customer always gets their own addresses. An admin or store role may
        pass user_id to read another user's addresses in the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: country_name
          in: query
          required: false
          description: Filter by country name.
          schema:
            type: string
            example: India
        - name: user_id
          in: query
          required: false
          description: Admin or store role only. Target user id in the caller's tenant.
          schema:
            type: integer
            format: int64
            example: 1001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      addresses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Address"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/address:
    put:
      tags:
        - users-customer-addresses
      operationId: users_updateCustomerAddress
      summary: Update a customer address or set it as default
      description: >-
        Updates one of the caller's addresses by address_id. Only the fields sent are changed. To make an address the
        default, send is_default true. The customer app uses this one route for both edit and set-default.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdateRequest"
            example:
              address_id: 5001
              is_default: true
      responses:
        "200":
          description: Address updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The app's setDefaultAddress sends user_id in the body. This operation's request type has no user_id field,
        so it is ignored. The app's updateAddress also sends user_id, which this operation ignores. Confirm the
        not-found and cross-user error types with the dh-user-profile team; they are not verified here.
  /api/v1/users/customer/address/delete/{id}:
    post:
      tags:
        - users-customer-addresses
      operationId: users_deleteCustomerAddress
      summary: Delete a customer address
      description: >-
        Soft-deletes one of the caller's addresses. The address can be restored with the undo operation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Address id.
          schema:
            type: integer
            format: int64
            example: 5001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/address/undo/{id}:
    post:
      tags:
        - users-customer-addresses
      operationId: users_undoDeleteCustomerAddress
      summary: Undo a customer address delete
      description: >-
        Restores an address deleted with the delete operation. Call it within the undo window shown by the app.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Address id.
          schema:
            type: integer
            format: int64
            example: 5001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: The undo window length is not stated in the code path reviewed. Confirm before stating a time limit.
  /api/v1/users/user/{identifier_type}/change:
    post:
      tags:
        - users-contact-change
      operationId: users_requestContactChangeOtp
      summary: Request an OTP to change the customer email or phone
      description: >-
        Sends an OTP to the new email or phone so the caller can change it. Then call the verify operation with
        the returned session. This operation sends a message to the customer's new contact, so it is rate-limited
        (OTP initiate limit).
      x-security-note: Sends an OTP by email or SMS. Rate-limited per identifier. Do not use real contacts in tests.
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: path
          required: true
          description: Contact type to change.
          schema:
            type: string
            enum:
              - email
              - phone
            example: email
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactChangeRequest"
            example:
              identifier: new.customer@example.com
              otp_type: email_change
              provider_type: ses
      responses:
        "201":
          description: OTP sent. The body holds the session for the verify call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: The response is the usecase result (cognitoResp). Its fields are not verified; confirm before documenting them.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: Response shape not verified.
  /api/v1/users/user/{identifier_type}/verify:
    post:
      tags:
        - users-contact-change
      operationId: users_verifyContactChangeOtp
      summary: Verify the OTP for an email or phone change
      description: >-
        Verifies the OTP sent by the change operation and completes the change. Call it with the session and
        cognito_username from the change response.
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: path
          required: true
          description: Contact type to verify.
          schema:
            type: string
            enum:
              - email
              - phone
            example: email
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactVerifyRequest"
            example:
              cognito_username: test-user-name
              session: test-session-token
              otp_code: "123456"
              otp_type: email_change
              identifier: new.customer@example.com
              role_id: 4
      responses:
        "201":
          description: Contact changed. The body is a confirmation message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: OTP verified
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOtp"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The app's confirmPasswordChange posts new_password and confirm_password to this operation. VerifyOtpRequest
        has no such fields. Password change uses POST /otp/verify/password_change. Confirm with the app team. The
        customer app also sends otp_type phone_change for phone changes; the accepted otp_type values are not
        enumerated in the code reviewed.
  /api/v1/users/otp/initiate:
    post:
      tags:
        - users-otp
      operationId: users_initiateOtp
      summary: Start an OTP for signup, login or password change
      description: >-
        Starts an OTP challenge for an email or phone identifier. Returns 201 when a code is sent. For a login
        step that sends no code, it returns 200 with login_methods. Public, no token is needed. Rate-limited.
      x-security-note: Sends an OTP by email or SMS. Rate-limited. Do not use real contacts in tests.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInitiateRequest"
            example:
              identifier: test.customer@example.com
              identifier_type: email
              tenant_id: 00000000-0000-4000-8000-000000000001
              role_id: "4"
              type: signup
              provider_type: ses
              device_info:
                device_id: test-device-001
                device_name: Test Device
                device_type: web
                os_version: "1.0"
                app_version: "1.0.0"
      responses:
        "200":
          description: Login step; no code sent. The body lists the login methods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OtpInitiateResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "201":
          description: OTP sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OtpInitiateResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        Mismatch: the app's initiateOTP (authService.ts) reads data.session and data.username from this response, but
        the handler returns only the OtpInitiateResponse struct (type and login_methods). Verify the usecase output
        before the QA tests assume a session. The DTO also marks device_info as required, while the app sends it as
        optional. The type field's allowed values are not enumerated in the code reviewed.
  /api/v1/users/otp/verify/{otptype}:
    post:
      tags:
        - users-otp
      operationId: users_verifyOtp
      summary: Verify an OTP for signup, login or password change
      description: >-
        Verifies the OTP from the initiate operation. The request body type depends on otptype: signup uses the
        signup body, login and password_change use the login body. A wrong OTP returns 403 with details.session, a
        new session to use for the retry. Call after /otp/initiate.
      security:
        - bearerAuth: []
      parameters:
        - name: otptype
          in: path
          required: true
          description: OTP purpose. Other OTP types the route accepts (enable_2fa, link social account) are not documented here.
          schema:
            type: string
            enum:
              - signup
              - login
              - password_change
            example: login
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OtpVerifySignupRequest"
                - $ref: "#/components/schemas/OtpVerifyLoginRequest"
            example:
              identifier: test.customer@example.com
              identifier_type: email
              session: test-session-token
              otp_code: "123456"
              username: test-user-name
              tenant_id: 00000000-0000-4000-8000-000000000001
              role_id: "4"
              device_info:
                device_id: test-device-001
                device_name: Test Device
                device_type: web
                os_version: "1.0"
                app_version: "1.0.0"
      responses:
        "200":
          description: OTP verified. The body holds the tokens for login and password change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LoginVerifyResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/InvalidOtp"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: Confirm whether this operation needs a bearer token.
  /api/v1/users/customer/login:
    post:
      tags:
        - users-customer-login
      operationId: users_customerLogin
      summary: Customer login with email and password
      description: >-
        Logs a customer in with email and password for a tenant. Public, no token is needed. Returns
        tokens, or a 2FA challenge (2fa_required, session) when 2FA applies. Rate-limited.
      x-security-note: Credential endpoint. Rate-limited. Use only synthetic test accounts.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
            example:
              email: test.customer@example.com
              password: synthetic-test-password
              tenant_id: 00000000-0000-4000-8000-000000000001
              device_info:
                device_id: test-device-001
                device_name: Test Device
                device_type: web
                os_version: "1.0"
                app_version: "1.0.0"
      responses:
        "200":
          description: Login result with tokens (or a 2FA challenge).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CustomerLoginResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The customer app's customerLogin sends role, not role_id; it also sends no device_info by default. The DTO
        requires device_info. Confirm the exact body the app sends before QA uses it.
  /api/v1/users/customer/logout:
    post:
      tags:
        - users-customer-login
      operationId: users_customerLogout
      summary: Log the customer out
      description: >-
        Ends the caller's session. device_id is optional and limits the logout to one device. Requires a Bearer token.
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: false
          description: Device to log out. Optional.
          schema:
            type: string
            example: test-device-001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: Logged out successfully
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/reset_password:
    post:
      tags:
        - users-customer-login
      operationId: users_resetCustomerPassword
      summary: Set a new customer password after an OTP
      description: >-
        Sets a new password using the session from the password_change OTP flow. Public. Both password
        fields must match. Rate-limited.
      x-security-note: Credential endpoint. Rate-limited. Use only synthetic test accounts.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNewPasswordRequest"
            example:
              session: test-session-token
              new_password: synthetic-new-password
              confirm_password: synthetic-new-password
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: Updated successfully
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
