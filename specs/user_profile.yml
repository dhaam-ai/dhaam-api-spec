openapi: 3.0.1
info:
  title: Dhaam User Profile Service API
  version: 1.0.0
  description: >-
    Customer profile, customer addresses, customer login and OTP, the store (merchant) and admin logins, and the store setup calls used for admin test data. Served under /api/v1/users. Only routes that the customer app calls, plus the store calls needed for admin setup, are documented here. Auth: operations marked security [] need no token. All other operations need `Authorization: Bearer {{token}}`, where the token is data.id_token from a login. Language: Accept-Language en (default) or es, read by the handlers. Login: password login is POST /customer/login, /store/login or /tenant/login; the server sets the role and derives the sign-in (Cognito) username, so clients never compute or send one. OTP login works for every role: POST /otp/initiate with type login, then POST /otp/verify/login with the session and username it returns. Logins checked against live (b637d0ca) and development (cefde53b). Customer addresses: create, then update or delete by address id. Errors: the envelope is {success: false, error: {type, message, details}, meta}. Rate-limited routes return 429 with {error: rate_limit_exceeded, message, retry_after} and a Retry-After header. Pagination: none on these routes. Idempotency: none. Source: dh-user-profile development (5a6e9d57). Customer app calls checked against live (b9fa15e). Outlet read (GET /api/v1/users/outlets/{id}) checked against live (b637d0ca).
  x-source-commit: 5a6e9d57 (dh-user-profile development)
servers:
  - url: "{{baseUrl}}"
tags:
  - name: users-customer-profile
    description: Customer profile read and update.
  - name: users-customer-addresses
    description: Customer addresses (create, list, update, delete, undo delete).
  - name: users-contact-change
    description: Change and verify the customer email or phone with an OTP.
  - name: users-otp
    description: OTP initiate and verify (signup, login, password change). OTP login works for customers, merchants and admins.
  - name: users-customer-login
    description: Customer login, logout and password reset.
  - name: users-admin-login
    description: Tenant admin (console) password login.
  - name: users-store-setup
    description: Store login, store registration and store info, used for admin test-data setup.
  - name: users-outlet-hours
    description: Outlet read with its opening hours (delivery and pickup schedules).
paths:
  /api/v1/users/customer/{id}:
    get:
      tags:
        - users-customer-profile
      operationId: users_getCustomerProfile
      summary: Get a customer profile
      description: >-
        Returns the profile of the customer with the given numeric user id. Requires a Bearer token. The customer app calls this with its numeric user id from local storage.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'Customer user id: the numeric `user.id` from the login response.'
          schema:
            type: integer
            format: int64
            example: 1001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Customer profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CustomerProfile"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The customer app (authService.ts) also calls GET /api/v1/users/customer/info?user_id=. No route matches it: /customer/info resolves to this operation with id set to info. Confirm with the app team; do not document that call as a route.
  /api/v1/users/customer/info:
    put:
      tags:
        - users-customer-profile
      operationId: users_updateCustomerProfile
      summary: Update the customer's own profile
      description: >-
        Updates the caller's own profile (full name, username, referral code, avatar, template fields). For a non-admin caller, customer_id must be empty or equal to the caller's own id, or the call returns 401. The customer app sends full_name and avatar_url here. Call after login.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
            example:
              full_name: Test Customer
              avatar_url: https://cdn.example.com/avatars/test-customer.png
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: Response is the domain TenantProfile struct. Its JSON fields are not listed here; confirm before documenting them.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The customer app's updateProfile sends profile_picture and identifier, and registerCustomer (authService.ts) sends this same route with mobile, email, referral_code and device_info. UpdateProfileRequest has none of those fields (it has avatar_url and referal_code, spelled as in the code). Unknown fields are ignored by the bind, so those values are dropped. Confirm the intended contract with the app team.
  /api/v1/users/customer/add-address:
    post:
      tags:
        - users-customer-addresses
      operationId: users_addCustomerAddress
      summary: Add a customer address
      description: >-
        Creates an address for the caller. Requires address_line_1, city and country. Latitude and longitude are stored as sent (no range check in the validator).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreateRequest"
            example:
              label: Home
              address_line_1: 12 Example Street
              address_line_2: Near Test Park
              city: Testville
              state: Test State
              postal_code: "560001"
              country: India
              latitude: 12.9716
              longitude: 77.5946
              is_default: true
              receiver_name: Test Customer
              receiver_mobile: "5550100123"
              delivery_note_text: Ring the bell
      responses:
        "200":
          description: Address created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AddAddressResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The response echoes the input fields and does not return the new address id. The customer app's createAddress reads result.data.address, which the backend never sends. Confirm whether the id should be returned. The app also sends floor and landmark, which AddressReq does not have (ignored). The body user_id is
  /api/v1/users/customer/addresses:
    get:
      tags:
        - users-customer-addresses
      operationId: users_listCustomerAddresses
      summary: List the caller's addresses
      description: >-
        Returns the caller's addresses. A customer always gets their own addresses. An admin or store role may pass user_id to read another user's addresses in the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: country_name
          in: query
          required: false
          description: Filter by country name.
          schema:
            type: string
            example: India
        - name: user_id
          in: query
          required: false
          description: Admin or store role only. Target user id in the caller's tenant.
          schema:
            type: integer
            format: int64
            example: 1001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      addresses:
                        type: array
                        items:
                          $ref: "#/components/schemas/Address"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/address:
    put:
      tags:
        - users-customer-addresses
      operationId: users_updateCustomerAddress
      summary: Update a customer address or set it as default
      description: >-
        Updates one of the caller's addresses by address_id. Only the fields sent are changed. To make an address the default, send is_default true. The customer app uses this one route for both edit and set-default.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressUpdateRequest"
            example:
              address_id: 5001
              is_default: true
      responses:
        "200":
          description: Address updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The app's setDefaultAddress sends user_id in the body. This operation's request type has no user_id field, so it is ignored. The app's updateAddress also sends user_id, which this operation ignores. Confirm the not-found and cross-user error types with the dh-user-profile team; they are not verified here.
  /api/v1/users/customer/address/delete/{id}:
    post:
      tags:
        - users-customer-addresses
      operationId: users_deleteCustomerAddress
      summary: Delete a customer address
      description: >-
        Soft-deletes one of the caller's addresses. The address can be restored with the undo operation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'Address id: the numeric `id` of the address in the address list.'
          schema:
            type: integer
            format: int64
            example: 5001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/address/undo/{id}:
    post:
      tags:
        - users-customer-addresses
      operationId: users_undoDeleteCustomerAddress
      summary: Undo a customer address delete
      description: >-
        Restores an address deleted with the delete operation. Call it within the undo window shown by the app.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Address id of the address deleted a moment ago (same id as the delete call).
          schema:
            type: integer
            format: int64
            example: 5001
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Address restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      address_id:
                        type: integer
                        format: int64
                        example: 5001
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: The undo window length is not stated in the code path reviewed. Confirm before stating a time limit.
  /api/v1/users/user/{identifier_type}/change:
    post:
      tags:
        - users-contact-change
      operationId: users_requestContactChangeOtp
      summary: Request an OTP to change the customer email or phone
      description: >-
        Sends an OTP to the new email or phone so the caller can change it. Then call the verify operation with the returned session. This operation sends a message to the customer's new contact, so it is rate-limited (OTP initiate limit).
      x-security-note: Sends an OTP by email or SMS. Rate-limited per identifier. Do not use real contacts in tests.
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: path
          required: true
          description: 'What to change: email or phone.'
          schema:
            type: string
            enum:
              - email
              - phone
            example: email
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactChangeRequest"
            example:
              identifier: new.customer@example.com
              otp_type: email_change
              provider_type: ses
      responses:
        "201":
          description: OTP sent. The body holds the session for the verify call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: The response is the usecase result (cognitoResp). Its fields are not verified; confirm before documenting them.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: Response shape not verified.
  /api/v1/users/user/{identifier_type}/verify:
    post:
      tags:
        - users-contact-change
      operationId: users_verifyContactChangeOtp
      summary: Verify the OTP for an email or phone change
      description: >-
        Verifies the OTP sent by the change operation and completes the change. Call it with the session and cognito_username from the change response.
      security:
        - bearerAuth: []
      parameters:
        - name: identifier_type
          in: path
          required: true
          description: 'What to verify: email or phone (the same as the change call).'
          schema:
            type: string
            enum:
              - email
              - phone
            example: email
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactVerifyRequest"
            example:
              cognito_username: test-user-name
              session: test-session-token
              otp_code: "<otp>"
              otp_type: email_change
              identifier: new.customer@example.com
              role_id: 4
      responses:
        "201":
          description: Contact changed. The body is a confirmation message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: OTP verified
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InvalidOtp"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        The app's confirmPasswordChange posts new_password and confirm_password to this operation. VerifyOtpRequest has no such fields. Password change uses POST /otp/verify/password_change. Confirm with the app team. The customer app also sends otp_type phone_change for phone changes; the accepted otp_type values are not enumerated in the code reviewed.
  /api/v1/users/otp/initiate:
    post:
      tags:
        - users-otp
      operationId: users_initiateOtp
      summary: Start an OTP for signup, login or password change
      description: >-
        Starts an OTP challenge for an email or phone identifier and sends the code. Public, no token is needed. Rate-limited.
        OTP login, for any role (role_id "1" admin, "2" merchant, "4" customer):
        1. Call this with type login. 2. Read data.session and data.username from the 201 response (both sit directly under data).
        3. Call POST /api/v1/users/otp/verify/login with them, the same identifier, identifier_type, country_code, role_id and tenant_id, and the code as otp_code.
        4. Send data.id_token from the verify response as `Authorization: Bearer <id_token>`.
        A login for an identifier with no account of that role returns 404. Newer builds also return data.type, and answer a login sent without otp_challenge true with 200 and data.login_methods instead of a session; send otp_challenge true to always get a session.
      x-security-note: Sends an OTP by email or SMS. Rate-limited. Do not use real contacts in tests.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInitiateRequest"
            examples:
              customerEmailLogin:
                summary: Customer, email OTP login
                value:
                  identifier: user@example.com
                  identifier_type: email
                  tenant_id: 00000000-0000-4000-8000-000000000001
                  role_id: "4"
                  type: login
                  otp_challenge: true
                  provider_type: ses
                  device_info:
                    device_id: 00000000-0000-4000-8000-000000000003
                    device_name: web-client
                    device_type: web
                    os_version: ""
                    app_version: "1.0.0"
              merchantPhoneLogin:
                summary: Merchant, phone OTP login by SMS
                value:
                  identifier: "<phone>"
                  identifier_type: phone
                  country_code: "+1"
                  tenant_id: 00000000-0000-4000-8000-000000000001
                  role_id: "2"
                  type: login
                  otp_challenge: true
                  provider_type: sms
                  device_info:
                    device_id: 00000000-0000-4000-8000-000000000003
                    device_name: web-client
                    device_type: web
                    os_version: ""
                    app_version: "1.0.0"
              adminEmailLogin:
                summary: Admin, email OTP login
                value:
                  identifier: admin@example.com
                  identifier_type: email
                  tenant_id: 00000000-0000-4000-8000-000000000001
                  role_id: "1"
                  type: login
                  otp_challenge: true
                  provider_type: ses
                  device_info:
                    device_id: 00000000-0000-4000-8000-000000000003
                    device_name: web-client
                    device_type: web
                    os_version: ""
                    app_version: "1.0.0"
      responses:
        "200":
          description: Newer builds only. A login sent without otp_challenge true; no code sent and no session. The body lists the login methods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OtpInitiateResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "201":
          description: OTP sent. data.session and data.username are the values the verify step needs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OtpInitiateResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
              example:
                success: true
                data:
                  session: "<session>"
                  username: "<username>"
                  challenge_name: ""
                  message: "<message>"
                meta:
                  timestamp: "2026-01-01T00:00:00Z"
                  request_id: 00000000-0000-4000-8000-000000000002
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Refused. FORBIDDEN when the reCAPTCHA check fails; ACCESS_DENIED when the account is awaiting approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No account of this role for the identifier (PROFILE_NOT_FOUND). Returned for type login and password_change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The delivery provider in provider_type is not enabled for the tenant (BUSINESS_RULE_VIOLATION). Returned for merchant-side roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/otp/verify/{otptype}:
    post:
      tags:
        - users-otp
      operationId: users_verifyOtp
      summary: Verify an OTP for signup, login or password change
      description: >-
        Verifies the OTP from the initiate operation. Public, no token is needed. Rate-limited. The request body type depends on otptype: signup uses the signup body, login and password_change use the login body. A wrong OTP returns 403 with details.session, a new session to use for the retry.
        OTP login (otptype login), for any role: send the session and username from the POST /api/v1/users/otp/initiate response, the code as otp_code, and the same identifier, identifier_type, country_code, role_id and tenant_id. The 200 response has the same tokens as the password logins; send data.id_token as `Authorization: Bearer <id_token>`.
        2FA after a password login: when a password login returns data.2fa_required true, call this with otptype login and the identifier, identifier_type, country_code, session, username, role_id and tenant_id from that response, plus the code.
      security: []
      parameters:
        - name: otptype
          in: path
          required: true
          description: 'Which code to verify; use the same value as `type` in the initiate call: signup = new account, login = sign in with a code, password_change = reset the password.'
          schema:
            type: string
            enum:
              - signup
              - login
              - password_change
            example: login
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/OtpVerifySignupRequest"
                - $ref: "#/components/schemas/OtpVerifyLoginRequest"
            example:
              identifier: user@example.com
              identifier_type: email
              session: "<session>"
              otp_code: "<otp>"
              username: "<username>"
              tenant_id: 00000000-0000-4000-8000-000000000001
              role_id: "4"
              device_info:
                device_id: 00000000-0000-4000-8000-000000000003
                device_name: web-client
                device_type: web
                os_version: ""
                app_version: "1.0.0"
      responses:
        "200":
          description: OTP verified. The body holds the tokens for login and password change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LoginVerifyResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          description: Invalid request, or the session is unknown, expired or does not match the identifier (INVALID_INPUT, VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: >-
            Wrong OTP (ACCESS_DENIED with the message Invalid OTP; details.session holds a new session for the retry), or the account is deleted, blocked, inactive or awaiting approval (ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No account matches the verified code (USER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/customer/login:
    post:
      tags:
        - users-customer-login
      operationId: users_customerLogin
      summary: Customer login with email and password
      description: >-
        Logs a customer in with email and password for a tenant. Public, no token is needed. Rate-limited.
        tenant_id is the tenant's UUID (a numeric id is rejected with 400); POST /api/v1/auth/tenant-by-domain returns it for a site hostname.
        The server sets the role to customer (4) and derives the sign-in (Cognito) username itself; the client never computes or sends one.
        device_info.device_id is a client-generated UUID: create one per account and reuse it on later logins.
        The 200 response carries data.id_token: send it as `Authorization: Bearer <id_token>` on protected routes. It is valid for 60 minutes (data.expires_in is 3600 seconds); log in again or refresh it after that.
        When the account has 2FA on, the 200 response is a challenge instead (data.2fa_required true, no tokens) and the code is sent; finish with POST /api/v1/users/otp/verify/login.
      x-security-note: Credential endpoint. Rate-limited. Use only synthetic test accounts.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerLoginRequest"
            example:
              email: user@example.com
              password: "<password>"
              tenant_id: 00000000-0000-4000-8000-000000000001
              device_info:
                device_id: 00000000-0000-4000-8000-000000000003
                device_name: web-client
                device_type: web
                os_version: ""
                app_version: "1.0.0"
      responses:
        "200":
          description: Login result with tokens, or a 2FA challenge when data.2fa_required is true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CustomerLoginResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
              examples:
                tokens:
                  summary: Logged in
                  value:
                    success: true
                    data:
                      access_token: "<access_token>"
                      refresh_token: "<refresh_token>"
                      id_token: "<id_token>"
                      expires_in: 3600
                      token_type: Bearer
                      user:
                        id: 00000000-0000-4000-8000-000000000004
                        user_id: 1001
                        email: user@example.com
                        status: 9
                        verification_status: 1
                        is_email_verified: true
                        is_phone_verified: false
                        outlet_uuid: null
                        tenant_id: null
                    meta:
                      timestamp: "2026-01-01T00:00:00Z"
                      request_id: 00000000-0000-4000-8000-000000000002
                twoFactorChallenge:
                  summary: 2FA challenge (no tokens)
                  value:
                    success: true
                    data:
                      2fa_required: true
                      session: "<session>"
                      username: "<username>"
                      identifier: user@example.com
                      identifier_type: email
                      role_id: "4"
                      tenant_id: 00000000-0000-4000-8000-000000000001
                    meta:
                      timestamp: "2026-01-01T00:00:00Z"
                      request_id: 00000000-0000-4000-8000-000000000002
        "400":
          $ref: "#/components/responses/LoginBadRequest"
        "401":
          $ref: "#/components/responses/LoginUnauthorized"
        "403":
          description: Refused. FORBIDDEN when the reCAPTCHA check fails; ACCESS_DENIED when the account is deleted, blocked, not active or awaiting approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/LoginUserNotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
