    ContactChangeRequest:
      type: object
      required:
        - identifier
        - otp_type
      properties:
        identifier:
          type: string
          description: New email address or phone number.
          example: new.customer@example.com
        otp_type:
          type: string
          example: email_change
          description: email_change to change the email, phone_change to change the phone.
          enum:
            - email_change
            - phone_change
        provider_type:
          type: string
          description: 'Who delivers the code: ses = email, sms = text message, whatsapp = WhatsApp message. Use ses with an email identifier, sms or whatsapp with a phone.'
          example: ses
          enum:
            - ses
            - sms
            - whatsapp
        country_code:
          type: string
          description: Required for phone.
          example: "+1"
        device_information:
          $ref: "#/components/schemas/DeviceInformation"
    ContactVerifyRequest:
      type: object
      required:
        - cognito_username
        - session
        - otp_code
        - identifier
      properties:
        cognito_username:
          type: string
          example: test-user-name
        session:
          type: string
          example: test-session-token
        otp_code:
          type: string
          example: "<otp>"
        otp_type:
          type: string
          example: email_change
          description: The same otp_type as the change request.
          enum:
            - email_change
            - phone_change
        identifier:
          type: string
          example: new.customer@example.com
        country_code:
          type: string
          example: "+1"
        update_type:
          type: string
        role_id:
          type: integer
          format: int64
          example: 4
    OtpInitiateRequest:
      type: object
      required:
        - identifier
        - identifier_type
        - tenant_id
        - role_id
        - type
        - provider_type
        - device_info
      properties:
        platform:
          type: string
          description: 'Where the request comes from: web, android or ios.'
          enum:
            - web
            - android
            - ios
          example: web
        identifier:
          type: string
          description: The email address, or the phone number in digits without the country code. Checked against identifier_type.
          example: user@example.com
        identifier_type:
          type: string
          enum:
            - email
            - phone
          example: email
        country_code:
          type: string
          description: Required for phone. Valid phone numbers are checked against the country code.
          example: "+1"
        tenant_id:
          type: string
          format: uuid
          description: Tenant UUID (not the numeric id). POST /api/v1/auth/tenant-by-domain returns it for a site hostname.
          example: 00000000-0000-4000-8000-000000000001
        role_id:
          type: string
          description: 'Role of the account, as a string: "1" admin, "2" merchant (store owner), "4" customer.'
          example: "4"
        name:
          type: string
          description: Signup only.
          example: Test Customer
        type:
          type: string
          description: 'Why the code is sent: signup, login, password_change, email_change, phone_change or enable2fa. Use login for an OTP login.'
          example: login
          enum:
            - signup
            - login
            - password_change
            - email_change
            - phone_change
            - enable2fa
        otp_challenge:
          type: boolean
          description: Newer builds read it; older ones ignore it. Send true on a login so the response always carries session and username.
          example: true
        provider_type:
          type: string
          description: 'Who delivers the code: ses = email, sms = text message, whatsapp = WhatsApp message. Use ses with an email identifier, sms or whatsapp with a phone.'
          example: ses
          enum:
            - ses
            - sms
            - whatsapp
        client_id:
          type: string
        method:
          type: string
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
        recaptcha_token:
          type: string
          description: Optional. A reCAPTCHA v3 token generated with action otp_<type> (otp_login for a login). The tenant may require it.
    OtpInitiateResponse:
      type: object
      properties:
        session:
          type: string
          description: Challenge session. Send it as session to POST /api/v1/users/otp/verify/{otptype}.
          example: "<session>"
        username:
          type: string
          description: Sign-in (Cognito) username for this challenge. Send it as username to the verify step; do not compute it.
          example: "<username>"
        challenge_name:
          type: string
          description: Empty.
          example: ""
        message:
          type: string
        type:
          type: string
          description: Newer builds only. The OTP type the server stored (signup or login); verify with /otp/verify/<type>.
          example: login
        login_methods:
          type: array
          description: Newer builds only, on the 200 response. The ways the existing account can sign in.
          items:
            type: string
            enum:
              - otp_challenge
              - password
          example:
            - otp_challenge
            - password
    OtpVerifySignupRequest:
      type: object
      required:
        - identifier
        - identifier_type
        - session
        - username
        - tenant_id
        - device_info
      properties:
        identifier:
          type: string
          example: test.customer@example.com
        identifier_type:
          type: string
          enum:
            - email
            - phone
        country_code:
          type: string
          example: "+1"
        otp_code:
          type: string
          example: "<otp>"
        username:
          type: string
          description: Cognito username from the initiate response.
          example: test-user-name
        session:
          type: string
          description: Session from the initiate response.
          example: test-session-token
        tenant_id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000001
        role_id:
          type: string
          example: "4"
        client_id:
          type: string
        method:
          type: string
        token:
          type: string
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
    OtpVerifyLoginRequest:
      type: object
      description: Body for otptype login and password_change. Used for OTP login and for the 2FA step after a password login.
      required:
        - identifier
        - identifier_type
        - otp_code
        - username
        - session
        - tenant_id
        - role_id
      properties:
        identifier:
          type: string
          description: The same identifier as the initiate call (or the 2FA challenge).
          example: user@example.com
        identifier_type:
          type: string
          enum:
            - email
            - phone
        country_code:
          type: string
          description: Required for phone.
          example: "+1"
        otp_code:
          type: string
          description: The code the user received.
          example: "<otp>"
        username:
          type: string
          description: data.username from the initiate response or the 2FA challenge.
          example: "<username>"
        session:
          type: string
          description: data.session from the initiate response or the 2FA challenge.
          example: "<session>"
        tenant_id:
          type: string
          format: uuid
          description: Tenant UUID, the same as in the initiate call.
          example: 00000000-0000-4000-8000-000000000001
        role_id:
          type: string
          description: 'The same role as the initiate call: "1" admin, "2" merchant, "4" customer.'
          example: "4"
        client_ip:
          type: string
          description: Ignored. The server uses the connection address.
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
    AuthResponseWithStatus:
      type: object
      description: Tokens and user summary returned by the password logins and by OTP verify.
      properties:
        access_token:
          type: string
          description: Cognito access token.
        refresh_token:
          type: string
          description: Refresh token for POST /api/v1/auth/refresh.
        id_token:
          type: string
          description: 'The bearer token for protected routes: send `Authorization: Bearer <id_token>`. Valid for 60 minutes.'
        expires_in:
          type: integer
          format: int64
          description: Token lifetime in seconds.
          example: 3600
        token_type:
          type: string
          example: Bearer
        user:
          $ref: "#/components/schemas/UserInfoWithStatus"
    LoginVerifyResponse:
      description: Same tokens and user summary as the password logins.
      allOf:
        - $ref: "#/components/schemas/AuthResponseWithStatus"
    UserInfoWithStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: integer
          format: int64
          example: 1001
        email:
          type: string
        user_name:
          type: string
        country_code:
          type: string
        phone_number:
          type: string
        is_active:
          type: boolean
        status:
          type: integer
          format: int64
        verification_status:
          type: integer
          format: int64
          description: 'Verification: 0 = not verified, 1 = email verified, 2 = phone verified, 3 = email and phone verified, 4 = verified by an admin.'
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          example: 1
        is_email_verified:
          type: boolean
        is_phone_verified:
          type: boolean
        outlet_uuid:
          type: string
          nullable: true
        tenant_id:
          type: string
          nullable: true
          description: Tenant UUID. Filled by OTP verify; null on the password logins.
    CustomerLoginRequest:
      type: object
      required:
        - email
        - password
        - tenant_id
        - device_info
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          description: Never log or echo.
          example: "<password>"
        tenant_id:
          type: string
          format: uuid
          description: Tenant UUID (not the numeric id). POST /api/v1/auth/tenant-by-domain returns it for a site hostname.
          example: 00000000-0000-4000-8000-000000000001
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
        recaptcha_token:
          type: string
          description: Optional. A reCAPTCHA v3 token generated with action login. The tenant may require it.
    CustomerLoginResponse:
      description: >-
        Either tokens (AuthResponseWithStatus fields) or, when 2fa_required is true, a 2FA challenge with no tokens. The challenge fields are what POST /api/v1/users/otp/verify/login needs.
      allOf:
        - $ref: "#/components/schemas/AuthResponseWithStatus"
        - type: object
          properties:
            2fa_required:
              type: boolean
              description: True when the account has 2FA on. Then no tokens are returned and the code is sent.
            session:
              type: string
              description: 2FA only. Send as session to the verify step.
            username:
              type: string
              description: 2FA only. The sign-in (Cognito) username; send it as username to the verify step. It is returned only here.
            identifier:
              type: string
              description: 2FA only. Where the code went (the phone on record, else the email).
            identifier_type:
              type: string
              description: 2FA only.
              enum:
                - email
                - phone
            country_code:
              type: string
              description: 2FA only, for a phone identifier.
            role_id:
              type: string
              description: 2FA only. The account role, as a string.
            tenant_id:
              type: string
              description: 2FA only. The tenant_id from the request.
