    OutletHoursDetail:
      type: object
      description: >-
        Outlet fields and opening hours. Only the outlet and hours fields are listed; other outlet fields in the
        response are not documented here.
      properties:
        outlet_id:
          type: integer
          format: int64
          example: 4001
        outlet_uuid:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000010
        store_id:
          type: integer
          format: int64
          example: 2001
        outlet_name:
          type: string
          example: Test Outlet
        is_active:
          type: boolean
          example: true
        is_pickup_timing:
          type: boolean
          description: True when pickup has its own hours (pickup_schedules).
          example: false
        delivery_schedules:
          type: array
          description: Delivery windows (delivery_mode 1). Omitted when the outlet has none.
          items:
            $ref: "#/components/schemas/OutletHoursWindow"
        pickup_schedules:
          type: array
          description: Pickup windows (delivery_mode 2). Omitted when the outlet has none.
          items:
            $ref: "#/components/schemas/OutletHoursWindow"
      additionalProperties: true
    OutletHoursWindow:
      type: object
      description: >-
        One stored opening window as read back. open_time and close_time are read as HH:MM:SS. Dates are YYYY-MM-DD.
      properties:
        id:
          type: integer
          format: int64
          example: 9001
        outlet_id:
          type: integer
          format: int64
          example: 4001
        day_of_week:
          type: integer
          description: ISO weekday, 1 is Monday and 7 is Sunday.
          example: 1
        slot_number:
          type: integer
          example: 1
        open_time:
          type: string
          example: '09:00:00'
        close_time:
          type: string
          example: '21:00:00'
        is_closed:
          type: boolean
          example: false
        schedule_type:
          type: integer
          description: 1 is regular.
          example: 1
        delivery_mode:
          type: integer
          description: 1 is delivery, 2 is pickup.
          example: 1
        holiday_id:
          type: integer
          format: int64
          example: 0
        effective_date:
          type: string
          format: date
          example: '2027-01-01'
        expiry_date:
          type: string
          format: date
          example: '2027-12-31'
        is_active:
          type: boolean
          example: true
