  /api/v1/users/store/info:
    put:
      tags:
        - users-store-setup
      operationId: users_updateStoreInfo
      summary: Update basic store details
      description: >-
        Updates the basic details of a store: name, description, address, business type, business categories and logo.
        A merchant edits only its own store. An admin may pass user_id. Requires a Bearer token. Store settings
        (preferences, analytics, service-area, tags, web domain) are not documented here.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: Store user id. Required for a manager role. An admin or merchant may omit it (the caller is used).
          schema:
            type: string
            example: "1001"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreInfoRequest"
            example:
              full_name: Test Store Updated
              description: Synthetic store for test data
              address:
                address_line_1: 1 Example Plaza
                city: Testville
                country: India
                postal_code: "560001"
                geo_location:
                  latitude: 12.9716
                  longitude: 77.5946
              business_type_id: "1"
              business_categories:
                - 1
              logo_url: https://cdn.example.com/logos/test-store.png
      responses:
        "200":
          description: Store updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: Response is the domain MerchantProfile struct. Its fields are not verified here.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        Also used for store settings in the storefront. This operation documents only the basic detail fields. Other
        fields in the same request body (preferences, is_sponsored, show_analytics_enabled, service_area_enforcement_enabled,
        add_user_tags, delete_user_tags, merchant_access_to_user_tags_enabled, web_domain, password, store_id) are
        settings or account fields and are excluded. Whether business_categories is needed for an orderable store is
        not confirmed.
  /api/v1/users/outlets/{id}:
    get:
      tags:
        - users-outlet-hours
      operationId: users_getOutletDetail
      summary: Get an outlet with its opening hours
      description: >-
        Returns one outlet with its opening hours: delivery_schedules (delivery_mode 1 rows) and pickup_schedules
        (delivery_mode 2 rows). A list is omitted when the outlet has no rows of that mode. Hours are written with
        POST /api/v1/profile/outlets and PUT /api/v1/profile/outlets/{id} (profile spec). The outlet must belong to the
        store resolved from the caller and store_uuid, or the call returns 403. Requires a Bearer token.
        The edge sets the identity headers; clients must not send them.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Outlet UUID (outlet_uuid).
          schema:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000010
        - name: store_uuid
          in: query
          required: false
          description: Store UUID. Required for admin and manager callers (404 when missing). Not used for merchant or outlet callers.
          schema:
            type: string
            format: uuid
            example: 00000000-0000-4000-8000-000000000301
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Outlet with its opening hours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/OutletHoursDetail"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
      x-todo: >-
        A UUID that matches no outlet is reported by the repository as a database error, so the call returns 500
        rather than 404. Confirm the intended status before QA asserts on it.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Response language. en (default) or es. Any other value falls back to en.
      schema:
        type: string
        enum:
          - en
          - es
        default: en
        example: en
  responses:
    BadRequest:
      description: Invalid request (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD, INVALID_UUID_FORMAT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid identity (UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID, LOGIN_REQUIRED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Access denied (ACCESS_DENIED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidOtp:
      description: >-
        Invalid OTP (ACCESS_DENIED with the error message Invalid OTP). details.session holds a new session for the retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Duplicate or conflicting record (DUPLICATE_ENTRY, USER_ALREADY_EXISTS).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: Body is not JSON (INVALID_INPUT with HTTP 415).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Rate limit exceeded. The Retry-After header and retry_after field give the wait in seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            example: 3600
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
    InternalError:
      description: Internal error. The message is masked; no details are returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        request_id:
          type: string
          example: 00000000-0000-4000-8000-000000000002
    ErrorDetail:
      type: object
      properties:
        type:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Invalid request body
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    RateLimitError:
      type: object
      description: Returned by the rate limiter. This body does not use the standard envelope.
      properties:
        error:
          type: string
          example: rate_limit_exceeded
        message:
          type: string
          example: Too many requests. Please try again later.
        retry_after:
          type: integer
          format: int64
          example: 3600
    DeviceInfo:
      type: object
      description: Device details sent with login, signup and OTP verify calls.
      required:
        - device_id
      properties:
        device_id:
          type: string
          example: test-device-001
        device_name:
          type: string
          example: Test Device
        device_type:
          type: string
          description: ios, android, web or desktop.
          example: web
        os_version:
          type: string
