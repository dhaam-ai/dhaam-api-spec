components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The id_token (data.id_token) from a login or OTP verify response, sent as: Authorization: Bearer <id_token>. Valid for 60 minutes."
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Response language. en (default) or es. Any other value falls back to en.
      schema:
        type: string
        enum:
          - en
          - es
        default: en
        example: en
  responses:
    BadRequest:
      description: Invalid request (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD, INVALID_UUID_FORMAT).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LoginBadRequest:
      description: Invalid request, including a tenant_id that is not a UUID or does not match a tenant (INVALID_INPUT, VALIDATION_FAILED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LoginUnauthorized:
      description: Credentials not accepted (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LoginAccessDenied:
      description: The account is deleted, blocked or not active (ACCESS_DENIED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LoginUserNotFound:
      description: No account of this role for the email in the tenant (USER_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid identity (UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID, LOGIN_REQUIRED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Access denied (ACCESS_DENIED).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidOtp:
      description: >-
        Invalid OTP (ACCESS_DENIED with the error message Invalid OTP). details.session holds a new session for the retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Duplicate or conflicting record (DUPLICATE_ENTRY, USER_ALREADY_EXISTS).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: Body is not JSON (INVALID_INPUT with HTTP 415).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Rate limit exceeded. The Retry-After header and retry_after field give the wait in seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
            example: 3600
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitError"
    InternalError:
      description: Internal error. The message is masked; no details are returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        request_id:
          type: string
          example: 00000000-0000-4000-8000-000000000002
    ErrorDetail:
      type: object
      properties:
        type:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Invalid request body
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        meta:
          $ref: "#/components/schemas/SuccessMeta"
    RateLimitError:
      type: object
      description: Returned by the rate limiter. This body does not use the standard envelope.
      properties:
        error:
          type: string
          example: rate_limit_exceeded
        message:
          type: string
          example: Too many requests. Please try again later.
        retry_after:
          type: integer
          format: int64
          example: 3600
    DeviceInfo:
      type: object
      description: Device details sent with login, signup and OTP verify calls.
      required:
        - device_id
      properties:
        device_id:
          type: string
          maxLength: 255
          description: Client-generated device id. The apps send a random UUID; create one per account and reuse it on later logins.
          example: 00000000-0000-4000-8000-000000000003
        device_name:
          type: string
          example: web-client
        device_type:
          type: string
          description: web, ios, android or desktop.
          example: web
          enum:
            - web
            - ios
            - android
            - desktop
        os_version:
          type: string
          description: May be empty.
          example: "1.0"
        app_version:
          type: string
          example: 1.0.0
        device_token:
          type: string
          description: Optional push token.
        ip_address:
          type: string
          description: Optional. The server may overwrite it from the connection.
        user_agent:
          type: string
          description: Optional.
    DeviceInformation:
      type: object
      description: Device details sent with the contact change OTP request (key device_information).
      properties:
        device_id:
          type: string
          example: test-device-001
        device_type:
          type: string
          example: web
        os:
          type: string
          example: test-os
        os_version:
          type: string
          example: "1.0"
        app_version:
          type: string
          example: 1.0.0
        ip_address:
          type: string
        host_name:
          type: string
        device_token:
          type: string
    CustomerProfile:
      type: object
      description: Customer profile (domain UserProfileResponse).
      additionalProperties: true
      x-todo: The JSON fields of UserProfileResponse are not listed. Confirm them before documenting the response shape.
    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Test Customer
        username:
          type: string
          example: test-user-name
        password:
          type: string
          format: password
          description: Used by the registration flow. Never log or echo.
        referal_code:
          type: string
          description: Referral code (JSON key is referal_code as in the code).
          example: TESTREF01
        avatar_url:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/test-customer.png
        customer_id:
          type: string
          description: Non-admin callers must send their own id or leave it empty.
          example: "1001"
        template:
          type: array
          items:
            $ref: "#/components/schemas/TemplateFieldEntry"
    TemplateFieldEntry:
      type: object
      properties:
        template_type:
          type: string
          example: customer_signup
        field_key:
          type: string
          example: test_field
        field_type:
          type: string
          example: text
        template_version:
          type: string
          example: "1"
    AddressCreateRequest:
      type: object
      required:
        - address_line_1
        - city
        - country
      properties:
        label:
          type: string
          example: Home
        user_id:
          type: integer
          format: int64
          description: See x-todo on the add-address operation.
          example: 1001
        is_default:
          type: boolean
          example: true
        address_line_1:
          type: string
          example: 12 Example Street
        address_line_2:
          type: string
          example: Near Test Park
        city:
          type: string
          example: Testville
        state:
          type: string
          example: Test State
        postal_code:
          type: string
          example: "560001"
        country:
          type: string
          example: India
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946
        house_no:
          type: string
          example: "12"
        receiver_name:
          type: string
          example: Test Customer
