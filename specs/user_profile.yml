          example: '09:00:00'
        close_time:
          type: string
          example: '21:00:00'
        is_closed:
          type: boolean
          example: false
        schedule_type:
          type: integer
          description: 'Schedule kind: 1 = regular opening hours.'
          example: 1
          enum:
            - 1
        delivery_mode:
          type: integer
          description: 1 = delivery hours, 2 = pickup hours.
          example: 1
          enum:
            - 1
            - 2
        holiday_id:
          type: integer
          format: int64
          example: 0
        effective_date:
          type: string
          format: date
          example: '2027-01-01'
        expiry_date:
          type: string
          format: date
          example: '2027-12-31'
        is_active:
          type: boolean
          example: true
