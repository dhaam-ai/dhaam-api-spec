  /api/v1/users/store/login:
    post:
      tags:
        - users-store-setup
      operationId: users_storeLogin
      summary: Store (merchant) login for a bearer token
      description: >-
        Logs a store (merchant) user in with email and password and returns tokens. Used to get a Bearer token for
        admin test-data setup. Public, no token is needed. Rate-limited.
      x-security-note: Credential endpoint. Rate-limited. Use only synthetic test accounts; never store the returned token in a spec.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantLoginRequest"
            example:
              email: test.store@example.com
              password: synthetic-test-password
              tenant_id: 00000000-0000-4000-8000-000000000001
              device_info:
                device_id: test-device-001
                device_name: Test Device
                device_type: web
                os_version: "1.0"
                app_version: "1.0.0"
      responses:
        "200":
          description: Login result with tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CustomerLoginResponse"
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/store/register:
    post:
      tags:
        - users-store-setup
      operationId: users_registerStore
      summary: Register a store (merchant) with login credentials
      description: >-
        Creates a store user with a login password, a store profile and its business type. This is the only store
        creation call in these services that sets a login password, so it is the one admin test setup needs before
        /store/login. Public, no token is needed. Rate-limited.
      x-security-note: Creates a store account. Use only synthetic data in tests and clean up test stores.
      x-todo: Confirm that the response includes the store id that POST /api/v1/profile/outlets requires.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreRegisterRequest"
            example:
              email: test.store@example.com
              password: synthetic-test-password
              phone: "5550100200"
              country_code: "+1"
              business_type: "1"
              address: 1 Example Plaza, Testville
              latitude: 12.9716
              longitude: 77.5946
              store_name: Test Store
              description: Synthetic store for test data
              first_name: Test
              last_name: Store
              city_id: Testville
              country: India
              postal_code: "560001"
      responses:
        "200":
          description: Store registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    additionalProperties: true
                    x-todo: Response is the domain User struct. Its fields are not verified here.
                  meta:
                    $ref: "#/components/schemas/SuccessMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
