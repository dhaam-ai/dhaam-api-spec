openapi: 3.0.1
info:
  title: Dhaam Catalog Service API (admin setup and customer browsing)
  version: 1.0.0
  description: >-
    Scoped to the calls needed to set up test data: category create, item create, get, update and list. Also documents POST /item/list, which the customer app calls for browsing. Public path prefix is /api/v1/catalog. Send `Authorization: Bearer {{token}}` where an operation needs it. Ordering: create categories and items before mapping them. Items are not visible to shoppers until they are mapped to a category (map-with-category, not in this file). Pagination for list endpoints: send current_page (1-based) and limit in the body; the total is returned in meta.total_count. Responses use the dh-shared envelope: success returns {success, data, meta}; failure returns {success:false, error:{type, message, details}, meta}. Successful responses are HTTP 200. Accept-Language 'es' returns Spanish messages; anything else returns English. No rate limit or idempotency key is defined in this service's code.
  x-source-commit: "810394d (dh-catalog-service development)"
  x-todo: Confirm whether this operation needs a bearer token.
servers:
  - url: "{{baseUrl}}"
tags:
  - name: catalog-setup-category
    description: Category creation (store setup, test data).
  - name: catalog-setup-product
    description: Product (item) create, get, update and list (store setup, test data).
  - name: catalog-customer-browse
    description: Item list calls made by the customer app.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 'Send es for Spanish messages. Any other value or no header returns English.'
      schema:
        type: string
        example: en
    ItemId:
      name: id
      in: path
      required: true
      description: Item UUID.
      schema:
        type: string
        format: uuid
    ItemMenuIdQuery:
      name: menu_id
      in: query
      required: false
      description: Optional menu ID. Scopes the returned item to a menu.
      schema:
        type: integer
        format: int64
    ItemOutletIdQuery:
      name: outlet_id
      in: query
      required: false
      description: Optional outlet ID. Scopes the returned item to an outlet.
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: Invalid input (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      x-todo: 'Body shape of the 401 response is not verified.'
    NotFound:
      description: Resource not found (RESOURCE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal error. The message is generic; details are logged server-side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              example: INVALID_INPUT
            message:
              type: string
              example: 'item_name is required'
            details:
              description: Present for validation errors.
        meta:
          type: object
          additionalProperties: true
    CategoryCreateRequest:
      type: object
      required: [type, category_name, category_type]
      properties:
        type:
          type: string
          description: parent = a top-level category, child = a subcategory under a parent category.
          example: parent
          x-todo: 'Allowed values for type are not enumerated in dh-catalog-service code. Confirm with the service owner.'
          enum:
            - parent
            - child
        category_name:
          type: string
          example: Beverages
        category_name_lang:
          type: object
          additionalProperties:
            type: string
          example:
            en: Beverages
        category_type:
          type: integer
          example: 2
          description: 1 = business category (platform level), 2 = product category (a store's own menu category). Store setup uses 2.
          enum:
            - 1
            - 2
        owner_id:
          type: integer
          format: int64
          example: 1001
        description:
          type: string
          example: Cold drinks and juices
        is_enabled:
          type: boolean
          example: true
        sequence:
          type: integer
          example: 1
        business_category_id:
          type: array
          items:
            type: integer
          example: [1]
        has_products:
          type: boolean
          example: true
    CategoryCreateResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000101
        category_id:
          type: integer
          format: int64
          example: 501
        name:
          type: string
          example: Beverages
        created_at:
          type: string
          format: date-time
          example: '2026-12-01T10:00:00Z'
    ItemCreateRequest:
      type: object
      required: [item_name, plu, entity_type]
      properties:
        item_name:
          type: string
          example: Sample Cola 330ml
        plu:
          type: string
          description: Item unit code, required by the service.
          example: SKU-0001
        entity_type:
          type: integer
          description: 'Item kind: 1 = product, 2 = modifier, 3 = modifier group, 4 = upsell, 5 = deal, 6 = variant, 7 = bundle. A plain product is 1.'
          example: 1
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
        owner_id:
          type: integer
          format: int64
          example: 1001
        item_name_lang:
          type: object
          additionalProperties:
            type: string
          example:
            en: Sample Cola 330ml
        description:
          type: string
          example: Sample cold drink for test data
        is_veg:
          type: integer
          example: 1
        image:
          type: string
          example: https://example.com/images/sample-cola.jpg
        pricing:
          $ref: '#/components/schemas/Pricing'
    ItemUpdateRequest:
      type: object
      description: Send only the fields to change. Omitted fields are left unchanged.
      properties:
        item_name:
          type: string
          example: Sample Cola 500ml
        is_active:
          type: integer
          description: 1 active, 0 inactive.
          example: 1
        description:
          type: string
          example: Updated sample description
        is_veg:
          type: integer
          example: 1
        image:
          type: string
          example: https://example.com/images/sample-cola-2.jpg
        pricing:
          $ref: '#/components/schemas/Pricing'
    Pricing:
      type: object
      properties:
        price:
          type: number
          format: double
          example: 40.0
        mrp:
          type: number
          format: double
          example: 50.0
        cost_price:
          type: number
          format: double
          example: 25.0
    ItemListRequest:
      type: object
      properties:
        limit:
          type: integer
          minimum: 0
          example: 20
        current_page:
          type: integer
          minimum: 0
          example: 1
        previous_page:
          type: integer
          example: 0
        entity_types:
          type: array
          items:
            type: integer
          description: Entity types to return. 1 is a product.
          example: [1]
        is_want_only_items:
          type: boolean
          example: true
        owner_id:
          type: integer
          format: int64
          example: 1001
        filters:
          type: object
          description: Optional filters. The customer app sends item_ids.
          properties:
            item_ids:
              type: array
              items:
                type: string
              example: ['00000000-0000-4000-8000-000000000201']
            menu_id:
              type: integer
              format: int64
            outlet_id:
              type: integer
              format: int64
            category_id:
              type: integer
              format: int64
            search_text:
              type: string
            status:
              type: integer
              enum: [1, 2, 3]
    ItemListResult:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            additionalProperties: true
            example:
              item_uuid: 00000000-0000-4000-8000-000000000201
              item_name: Sample Cola 330ml
              entity_type: 1
        meta:
          type: object
          properties:
            total_count:
              type: integer
              example: 1
            is_admin_approval:
              type: boolean
              example: false
    ItemResult:
      type: object
      description: Item detail. Fields are returned as stored by the service.
      additionalProperties: true
      example:
        item_uuid: 00000000-0000-4000-8000-000000000201
        item_name: Sample Cola 330ml
        entity_type: 1
    ItemCreated:
      type: object
      description: Shape of the created item response is not enumerated here.
      additionalProperties: true
      x-todo: 'Create response body for POST /item is not verified in this file. Only the status code (200) and envelope are confirmed.'
paths:
  /api/v1/catalog/category:
    post:
      tags: [catalog-setup-category]
      operationId: catalog_createCategory
      summary: Create a category
      description: >-
        Creates a category for the tenant from the request body. Also accepts sub_categories, product_ids and tag_ids (not documented here). Call before creating items that map to it.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
            example:
              type: parent
              category_name: Beverages
              category_name_lang:
                en: Beverages
              category_type: 2
              owner_id: 1001
              description: Cold drinks and juices
              is_enabled: true
              sequence: 1
      responses:
        '200':
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CategoryCreateResult'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/catalog/item:
    post:
      tags: [catalog-setup-product]
      operationId: catalog_createItem
      summary: Create a product (item)
      description: >-
        Creates an item. This file documents the product path only (entity_type 1). Map the item to a category separately before it is shown to shoppers. Tax IDs are product-only and are not used here.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
            example:
              item_name: Sample Cola 330ml
              plu: SKU-0001
              entity_type: 1
              owner_id: 1001
              description: Sample cold drink for test data
              is_veg: 1
              pricing:
                price: 40.0
                mrp: 50.0
                cost_price: 25.0
      responses:
        '200':
          description: Item created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemCreated'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/catalog/item/{id}:
    get:
      tags: [catalog-setup-product]
      operationId: catalog_getItem
      summary: Get an item by UUID
      description: Returns one item. Optional menu_id and outlet_id scope the returned data.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/ItemMenuIdQuery'
        - $ref: '#/components/parameters/ItemOutletIdQuery'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Item detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResult'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [catalog-setup-product]
      operationId: catalog_updateItem
      summary: Update an item
      description: Updates the fields sent in the body for an existing item. Omitted fields are left unchanged.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdateRequest'
            example:
              item_name: Sample Cola 500ml
              description: Updated sample description
              pricing:
                price: 45.0
                mrp: 55.0
                cost_price: 28.0
      responses:
        '200':
          description: Item updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ItemResult'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/catalog/item/list:
    post:
      tags: [catalog-setup-product, catalog-customer-browse]
      operationId: catalog_listItems
      summary: List items with pagination and filters
      description: >-
        Lists items for the tenant. The customer app calls this with entity_types [1], is_want_only_items true and filters.item_ids to load product cards. Total is in meta.total_count.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemListRequest'
            example:
              limit: 20
              current_page: 1
              previous_page: 0
              filters:
                item_ids: ['00000000-0000-4000-8000-000000000201']
              entity_types: [1]
              is_want_only_items: true
      responses:
        '200':
          description: Page of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
