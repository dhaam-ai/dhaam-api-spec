      responses:
        "200":
          description: "GraphQL response. \"data\" holds the result and \"errors\" lists resolver or validation errors. An operation can return both."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GraphqlResponse"
              examples:
                validationError:
                  summary: "Unknown field (no data)"
                  value:
                    errors:
                      - message: "Cannot query field \"unknownField\" on type \"Query\"."
                        locations:
                          - line: 1
                            column: 3
                resolverError:
                  summary: "Resolver error with partial data"
                  value:
                    data:
                      store: null
                    errors:
                      - message: "forbidden: store does not match outlet"
                        path:
                          - "store"
                internalError:
                  summary: "Database or internal error, sanitized"
                  value:
                    data: null
                    errors:
                      - message: "Something went wrong. Please try again after some time."
                        path:
                          - "homePage"
                        extensions:
                          code: "INTERNAL_SERVER_ERROR"
        "400":
          description: "The request body is not valid JSON. The body is plain text, not a GraphQL response. The gateway returns it before any query runs."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            "text/plain":
              schema:
                type: "string"
              example: "invalid character 'x' looking for beginning of value"
        "500":
          description: "Unexpected server error (for example, a recovered panic). The body is the gateway's JSON error envelope. The exact message text is not fixed."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: "Internal server error"
          x-todo: "The 500 body text comes from the recovered error; the exact text is not fixed in code."
        "503":
          description: "Load shed (searchPage only). The search circuit breaker is open or the request was refused to protect the database and OpenSearch. The body is the GraphQL response with errors[].extensions.code SEARCH_BUSY. Retry after the Retry-After seconds."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
            Retry-After:
              description: "Seconds to wait before retrying (at least 1)."
              schema:
                type: "integer"
                minimum: 1
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GraphqlResponse"
              example:
                data: null
                errors:
                  - message: "Search is busy, please try again."
                    path:
                      - "searchPage"
                    extensions:
                      code: "SEARCH_BUSY"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  headers:
    XRequestId:
      description: "Request ID, which is the trace ID. Generated by the gateway; a client-supplied value is not echoed."
      schema:
        type: "string"
  schemas:
    GraphqlRequest:
      type: "object"
      required:
        - "query"
      properties:
        query:
          type: "string"
          minLength: 1
          description: "The GraphQL document."
        operationName:
          type: "string"
          nullable: true
          description: "Which operation to run when the document has several."
        variables:
          type: "object"
          additionalProperties: true
          description: "Variable values keyed by name."
    GraphqlResponse:
      type: "object"
      description: "Standard GraphQL response. \"data\" is absent or null when the document fails to parse or validate, or when the root field fails."
      properties:
        data:
          type: "object"
          nullable: true
          additionalProperties: true
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/GraphqlError"
    GraphqlError:
      type: "object"
      required:
        - "message"
      properties:
        message:
          type: "string"
          description: "Client-safe message. Database and connection errors are replaced with \"Something went wrong. Please try again after some time.\" and extensions.code INTERNAL_SERVER_ERROR."
        locations:
          type: "array"
          items:
            type: "object"
            properties:
              line:
                type: "integer"
              column:
                type: "integer"
        path:
          type: "array"
          items:
            oneOf:
              - type: "string"
              - type: "integer"
        extensions:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Known codes: INTERNAL_SERVER_ERROR (sanitized internal error) and SEARCH_BUSY (searchPage shed load). Other resolver errors carry no code."
    ErrorEnvelope:
      type: "object"
      description: "JSON error envelope the gateway uses for non-GraphQL errors."
      required:
        - "success"
        - "error"
      properties:
        success:
          type: "boolean"
          enum:
            - false
        error:
          type: "string"
