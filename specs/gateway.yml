openapi: "3.0.1"
info:
  title: "Dhaam Storefront Gateway API"
  version: "1.0.0"
  description: |
    Public storefront GraphQL API, narrowed to the operations the customer app sends. All calls go to one endpoint, POST /api/v1/storefront/graphql.

    Auth: none.

    Responses: GraphQL returns HTTP 200 even when an operation fails. Always check the errors array. Parse and validation errors return no data. searchPage returns 503 with Retry-After while it sheds load.

    Pagination: the gateway caps pageSize at 50 (domain MaxPageSize). homePage and trendingSearches default to page 1 and pageSize 10 when not sent.

    Rate limits: the gateway applies none of its own. Ordering: none; every operation can be called directly.

    Examples use synthetic values only.
  x-source-commit: "7e97045 (dh-gateway-api development)"
  x-client-source-commit: "b9fa15e (dh-hyperlocal-customer-app-react live)"
servers:
  - url: "{{baseUrl}}"
tags:
  - name: "gateway-graphql"
    description: "Storefront GraphQL operations sent by the customer app"
paths:
  "/api/v1/storefront/graphql":
    post:
      tags:
        - "gateway-graphql"
      operationId: "gateway_graphql"
      summary: "Run a storefront GraphQL operation"
      description: |
        Runs one GraphQL operation against the storefront schema (specs/gateway.graphql, the full served SDL). Send JSON with query, optional operationName, and optional variables.

        The examples are the operations the customer app sends. Operation text and variable names are copied from the app. Each example is one operation:

        | Example | Root field(s) | App caller |
        |---|---|---|
                | getCheckoutTemplate | checkoutTemplate | app/checkout (fetchCheckoutTemplate) |
                | getStorefrontConfig | config | configSlice (main config) |
                | getWelcomePopup | config | configSlice (welcome popup, separate request) |
                | homePage | homePage | homeService.fetchHomePageData |
                | homePageFavoriteStores | homePage | homeService.fetchFavoriteStores (operation name is also HomePage) |
                | store | store | storeSlice.fetchStoreDetails |
                | storeSlots | store | storeSlice (slots for a date range) |
                | menuContent | menu | storeSlice.fetchMenuContent |
                | itemDetail | itemDetail | itemDetailSlice |
                | dealItemDetail | itemDetail | storeSlice (deal item details, operation name GetItemDetail) |
                | itemUpsells | itemUpsells | cartSlice and upsellSlice |
                | searchPage | searchPage, suggestions | SearchSuggestions (results, sent directly from the browser) |
                | searchSuggestions | suggestions | SearchSuggestions (sent directly from the browser) |
                | trendingSearches | trendingSearches | SearchSuggestions (sent directly from the browser) |
                | searchFilters | getFilters, quickFilter, sortby | SearchSuggestions (sent directly from the browser) |
                | searchMenuItems | searchMenuItems | StoreSearchModal (operation name is also Menu) |
                | promoMenu | promoMenu | stores/[id]/PromoItemsModal (query is inline in the component) |

        Operations with no example are not sent by the app and are not documented here.

        IDs (tenantId, customerId, storeId, outletId, merchantId, menuId) accept the numeric ID or the UUID.

      security: []
      x-todo: |
        1. gateway.graphql is the full served SDL (the schemaContent string in app/router/graphql.go, 836 lines), copied as-is and not trimmed to the customer app. The served SDL declares MenuCategory.image and MenuCategory.thumbUrl twice. graph-gophers accepts this at runtime, but strict SDL tools (graphql-js buildSchema) reject it, so Apidog import may fail. Left unchanged because the file must match the code. The example check ran with assumeValidSDL.
        2. api/graphql/schema.graphql in the gateway repo is embedded but not used at runtime and differs from the served schema (for example itemDetail and subItemIds). This spec follows the served schema.
        3. storeSlots (operation StoreSlots) selects OrderSettings.isTimeRangeSlot, timeSlotDurationMinutes and noOfDays. The served schema has none of them, so the whole document fails validation and the response has errors and no data. Reconcile the app selection or the schema.
        4. itemUpsells (ItemUpsells) selects itemUuid on ItemUpsellResult and uuid on upsells and products. The served schema has no itemUuid and Attached has no uuid, so the whole document fails validation. Reconcile.
        5. itemUpsells: app/redux/slices/cartSlice.ts calls fetchItemUpsells with number[] item IDs, but itemIds is [String!]!. graphql-js rejects a JSON number for String. The gateway runtime behaviour was not tested. The example uses string IDs, which the schema accepts.
        6. promoMenu (PromoMenu, inline in app/stores/[id]/PromoItemsModal.tsx) selects ItemDetail.itemUuid and ItemDetail.variants. The served schema has neither, so the whole document fails validation. Reconcile.
