      description: 'Returns one outlet with its opening hours: delivery_schedules (delivery_mode 1 rows) and pickup_schedules (delivery_mode 2 rows). A list is omitted when the outlet has no rows of that mode. Hours are written with POST /api/v1/profile/outlets and PUT /api/v1/profile/outlets/{id} (profile spec). The outlet must belong to the store resolved from the caller and store_uuid, or the call returns 403. Requires a Bearer token. The edge sets the identity headers; clients must not send them.'
      operationId: users_getOutletDetail
      parameters:
        - description: Outlet UUID (`outlet_uuid`), returned when the store is registered.
          in: path
          name: id
          required: true
          schema:
            example: '{{outletId}}'
            format: uuid
            type: string
        - description: Store UUID. Required for admin and manager callers (404 when missing). Not used for merchant or outlet callers.
          in: query
          name: store_uuid
          required: false
          schema:
            example: 00000000-0000-4000-8000-000000000301
            format: uuid
            type: string
        - $ref: '#/components/parameters/UserProfile_AcceptLanguage'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile_OutletHoursDetail'
                  meta:
                    $ref: '#/components/schemas/UserProfile_SuccessMeta'
                  success:
                    example: true
                    type: boolean
                type: object
          description: Outlet with its opening hours.
        "401":
          $ref: '#/components/responses/UserProfile_Unauthorized'
        "403":
          $ref: '#/components/responses/UserProfile_Forbidden'
        "404":
          $ref: '#/components/responses/UserProfile_NotFound'
        "500":
          $ref: '#/components/responses/UserProfile_InternalError'
      security:
        - bearerAuth: []
      summary: Get an outlet with its opening hours
      tags:
        - users-outlet-hours
      x-todo: A UUID that matches no outlet is reported by the repository as a database error, so the call returns 500 rather than 404. Confirm the intended status before QA asserts on it.
  /api/v1/users/store/info:
    put:
      description: 'Updates the basic details of a store: name, description, address, business type, business categories and logo. A merchant edits only its own store. An admin may pass user_id. Requires a Bearer token. Store settings (preferences, analytics, service-area, tags, web domain) are not documented here.'
      operationId: users_updateStoreInfo
      parameters:
        - description: Store user id. Required for a manager role. An admin or merchant may omit it (the caller is used).
          in: query
