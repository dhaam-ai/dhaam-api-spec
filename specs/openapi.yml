    post:
      description: |
        Runs one GraphQL operation against the storefront schema (specs/gateway.graphql, the full served SDL). Send JSON with query, optional operationName, and optional variables.

        The examples are the operations the customer app sends. Operation text and variable names are copied from the app. Each example is one operation:

        | Example | Root field(s) | App caller |
        |---|---|---|
                | getCheckoutTemplate | checkoutTemplate | app/checkout (fetchCheckoutTemplate) |
                | getStorefrontConfig | config | configSlice (main config) |
                | getWelcomePopup | config | configSlice (welcome popup, separate request) |
