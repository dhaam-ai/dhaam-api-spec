          type: string
          x-todo: Confirm whether the backend reads refund_method. The customer cancel path uses the cash/wallet rules documented above.
        status:
          description: 'Target status: 1 = New, 2 = Accepted, 3 = Assigned, 4 = Processed, 5 = Order ready, 6 = Picked up, 7 = Dispatched, 8 = Delivered, 9 = Cancelled. Store/staff: the next stage in the order 2, 3, 4, 5, 6, 7, 8, or 9 to reject. Customer: 9 only.'
