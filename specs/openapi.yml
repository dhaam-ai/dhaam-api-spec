      x-security-note: Lists schedule rows for admin test setup. Use with synthetic test data only.
  /api/v1/catalog/menu/schedule/{id}:
    get:
      description: Returns one schedule row for the schedule UUID, with no status filter. The handler returns 404 for any error from the lookup, including a database error.
      operationId: menu_getMenuSchedule
      parameters:
        - $ref: '#/components/parameters/Menu_ScheduleUuidPath'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Menu_MenuScheduleResponse'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: One schedule row.
        "401":
          $ref: '#/components/responses/Menu_Unauthorized'
        "404":
          $ref: '#/components/responses/Menu_NotFound'
      summary: Get one schedule row by its UUID
      tags:
        - menu-setup-time-slots
    post:
      description: 'Creates schedule rows for the menu in the path. The path id is the numeric menu_id; a non-numeric value returns 400. Each item in schedules is checked: schedule_type_id, event_type_id, day_of_week and event_name are required and non-zero, time_slots is required, and slots must be valid and must not overlap on the same day. The menu must belong to store_id (replaced by the caller''s own store for merchant and outlet roles). If outlet_id is set, the outlet must be assigned to the menu. Missing start_date defaults to the menu''s current date in its store''s time zone. Replies 201 with the menu''s active schedule rows (all of them, including rows that were already there), not only the rows just written. A menu_id in the body is ignored; the path value is used.'
      operationId: menu_createMenuSchedule
      parameters:
        - $ref: '#/components/parameters/Menu_MenuIdPath'
      requestBody:
        content:
          application/json:
            example:
              end_date: "2027-12-31"
              schedules:
                - day_of_week: 1
                  event_name: Lunch
                  event_type_id: 1
                  is_weekday_only: true
                  is_weekend_only: false
                  schedule_type_id: 1
                  store_id: 2001
                  time_slots:
                    - 11:00-14:00
                    - 18:00-21:00
              set_availablity: true
              start_date: "2027-01-01"
            schema:
              $ref: '#/components/schemas/Menu_MenuScheduleSetRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/Menu_MenuScheduleResponse'
                    type: array
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: Active schedule rows of the menu after the write.
        "400":
          $ref: '#/components/responses/Menu_BadRequest'
        "401":
          $ref: '#/components/responses/Menu_Unauthorized'
        "403":
          $ref: '#/components/responses/Menu_Forbidden'
        "404":
          $ref: '#/components/responses/Menu_NotFound'
        "500":
          $ref: '#/components/responses/Menu_InternalError'
      summary: Create the day and time-slot schedule of a menu
      tags:
        - menu-setup-time-slots
    put:
      description: 'Takes a schedule UUID and a body of schedule fields. Per the code path, the body is bound but not written: the repository runs a statement that deletes the schedule row and binds menu_id, which this call does not supply. The documented result is 500. Use only on synthetic test schedules.'
      operationId: menu_updateMenuSchedule
      parameters:
        - $ref: '#/components/parameters/Menu_ScheduleUuidPath'
      requestBody:
        content:
          application/json:
            example:
              available_from: "11:00:00"
              available_to: "14:00:00"
              day_of_week: 1
              description: Synthetic schedule for test data
              end_date: "2027-12-31"
              event_name: Lunch
              event_type_id: 1
              is_active: true
              is_weekday_only: true
              is_weekend_only: false
              priority: 100
              time_slots:
                - 11:00-14:00
              title: Demo lunch slot
            schema:
              $ref: '#/components/schemas/Menu_UpdateMenuScheduleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Menu_MenuScheduleResponse'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: The schedule row as returned after the update. Not reached on the documented code path.
        "400":
          $ref: '#/components/responses/Menu_BadRequest'
        "401":
          $ref: '#/components/responses/Menu_Unauthorized'
        "500":
          $ref: '#/components/responses/Menu_InternalError'
      summary: Update one schedule row
      tags:
        - menu-setup-time-slots
      x-security-note: Mutating admin call. Use only on synthetic test schedules.
      x-todo: The repository runs menu_schedule_update.sql, a DELETE that needs a menu_id bind. The update call does not supply it, so the statement is expected to fail with a database error (500) and nothing is updated. Not verified against a database. Confirm the intended behaviour before QA uses this call.
