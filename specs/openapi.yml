  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'JWT access token from the dh-auth login flow. Send as: Authorization: Bearer <token>'
      scheme: bearer
      type: http
paths:
  /api/v1/auth/{provider}/callback:
    post:
      description: Public. Verifies a provider token (Google or Apple id_token, Facebook access token) and returns DHAAM tokens. The provider is taken from the URL, not the body. The body tenant_id must match the tenant registered for the request domain. Rate limited per IP and per tenant (see info.description).
      operationId: auth_socialCallback
      parameters:
        - description: 'Social provider: google, apple or facebook. Put the same provider in the URL as the token you send.'
          in: path
          name: provider
          required: true
          schema:
            enum:
              - google
              - facebook
              - apple
            example: google
            type: string
      requestBody:
        content:
          application/json:
            examples:
              apple:
                summary: 'Apple: provider = apple, send the Apple id_token and the nonce used to get it; full_name only on the first sign-in'
                value:
                  action: callback
                  device_info:
                    app_version: 1.0.0
                    device_id: 00000000-0000-4000-8000-000000000001
                    device_name: Test phone
                    device_type: mobile
                    os_version: ios 17.0
                    user_agent: Example User Agent
                  full_name: Test Customer
                  nonce: '{{appleNonce}}'
                  provider_token: '{{appleIdToken}}'
                  role: "4"
                  tenant_id: '{{tenantId}}'
              facebook:
                summary: 'Facebook: provider = facebook, send the Facebook access token'
                value:
                  action: callback
                  device_info:
                    app_version: 1.0.0
                    device_id: 00000000-0000-4000-8000-000000000001
                    device_name: Test phone
                    device_type: mobile
                    os_version: ios 17.0
                    user_agent: Example User Agent
                  provider_token: '{{facebookAccessToken}}'
                  role: "4"
                  tenant_id: '{{tenantId}}'
              google:
                summary: 'Google: provider = google, send the Google id_token'
                value:
                  action: callback
                  device_info:
                    app_version: 1.0.0
                    device_id: 00000000-0000-4000-8000-000000000001
                    device_name: Test phone
                    device_type: mobile
                    os_version: ios 17.0
                    user_agent: Example User Agent
                  provider_token: '{{googleIdToken}}'
                  role: "4"
                  tenant_id: '{{tenantId}}'
            schema:
              $ref: '#/components/schemas/Auth_SocialCallbackRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_AuthTokensResponse'
          description: Tokens and user summary. The client checks user.status to decide whether profile completion is needed.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Validation failure (missing fields, action not initiate or callback), provider in body does not match URL, or tenant mismatch (INVALID_INPUT).
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Provider token rejected or could not be verified (UNAUTHORIZED).
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Account is awaiting admin approval (ACCESS_DENIED), or the role is not permitted for social login (FORBIDDEN).
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_RateLimitError'
          description: Rate limit exceeded. Retry-After header gives the wait in seconds. Body uses the rate-limit shape, not the standard envelope.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Internal error (INTERNAL_ERROR).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Upstream dependency unavailable (SERVICE_UNAVAILABLE).
      security: []
      summary: Sign in or sign up with a social provider
      tags:
        - auth-social-login
      x-todo:
        - The customer app fallback (FacebookLoginButton, used when the Facebook SDK is not loaded) navigates the browser to GET /api/v1/auth/facebook/callback with query parameters. The backend registers POST only, so that request gets 405. Confirm whether the fallback is still used; if so, add a GET handler or change the app.
        - The customer app sets the Apple redirect URI to /api/v1/auth/apple/callback. The backend accepts a JSON POST only. The app's sign-in path sends JSON through appleLoginInitiate, so this may only be the Apple console setting. Confirm the Apple flow mode (JS SDK or redirect/form_post).
        - The customer app sends device_info.device_type as mobile, tablet or desktop. The backend DTO comment lists ios, android, web or desktop, and the field is not validated. Confirm the accepted values.
        - action accepts initiate or callback. The customer app always sends callback. The callback handler does not branch on action in verify.go; confirm what initiate is expected to do, or remove it from the enum.
  /api/v1/auth/check-user:
    post:
      description: Public. Called by the customer app before OTP or password sign-in. Returns 200 with the exists flag. Phone identifiers are digits only, 4 to 14 characters.
      operationId: auth_checkUser
      parameters:
        - $ref: '#/components/parameters/Auth_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              country_code: "+1"
              domain: https://shop.example.com
              identifier: "5550100123"
              identifier_type: phone
              role_id: "4"
              tenant_id: 3f2b8a1e-4c5d-4e6f-8a9b-0c1d2e3f4a5b
            schema:
              $ref: '#/components/schemas/Auth_CheckUserRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_CheckUserResponse'
          description: Lookup result. exists is false when no account matches.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Validation failure (invalid phone or email format, invalid tenant_id).
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Internal error.
      security: []
      summary: Check whether an identifier has an account
      tags:
        - auth-check-user
      x-todo:
        - Customer app sends country_code as the selected country code. Confirm the expected format (for example +1 or 1) with the backend; the backend stores and matches it as received.
  /api/v1/auth/login:
    post:
      description: Public. Exchanges tenant_id, role, user_id and password for Cognito tokens. Use it to get a bearer token for admin setup calls. The Cognito username is derived from tenant_id, role and user_id, so all three must match the account. The customer app does not call this endpoint.
      operationId: auth_login
      requestBody:
        content:
          application/json:
            example:
              password: '{{password}}'
              role: "2"
              tenant_id: '{{tenantId}}'
              user_id: '{{userId}}'
            schema:
              $ref: '#/components/schemas/Auth_LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_AuthTokensResponse'
          description: Tokens and user summary.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Validation failure (password, tenant_id or role missing) or body not valid JSON.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Returned for wrong credentials and for Cognito errors as well. The error type is INTERNAL_ERROR with a generic message.
      security: []
      summary: Sign in with password (merchant and admin)
      tags:
        - auth-login
      x-todo:
        - Backend returns 500 INTERNAL_ERROR for wrong credentials because Cognito errors from MapAWSAuthError are plain errors, not AppErrors. A 401 is expected for NotAuthorizedException. Confirm and fix in the backend before QA relies on the status code.
        - user_id is optional in the request DTO, but the Cognito username needs it. Confirm which value admins use (internal numeric id or uuid). No client in dh-hyperlocal-customer-app-react or dh-manager-react found calls this endpoint.
  /api/v1/auth/refresh:
    post:
      description: Public. Exchanges a refresh_token for new id_token and access_token. The customer app calls it from its token manager after a 401. refresh_token in the response can be empty when Cognito does not rotate it; keep the previous refresh token in that case.
      operationId: auth_refreshToken
      requestBody:
        content:
          application/json:
            example:
              refresh_token: '{{refreshToken}}'
              role: 4
              tenant_id: '{{tenantId}}'
              user_id: '{{userId}}'
            schema:
              $ref: '#/components/schemas/Auth_RefreshRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_AuthTokensResponse'
          description: New tokens and user summary.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Validation failure (refresh_token or role missing, or role not an integer).
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth_ErrorResponse'
          description: Returned for an expired or revoked refresh token as well. The error type is INTERNAL_ERROR with a generic message.
      security: []
      summary: Refresh access and id tokens
      tags:
        - auth-login
      x-todo:
        - An expired or revoked refresh token returns 500 INTERNAL_ERROR (Cognito NotAuthorizedException is mapped to a plain error). Expected 401 TOKEN_EXPIRED or TOKEN_INVALID. The customer app treats any non-OK response as a failed refresh, so the status change will not break it. Confirm and fix in the backend.
        - tenant_id and user_id are not validated but are passed to the profile lookup. The customer app sends tenant UUID and user UUID. Confirm both are accepted as UUID strings.
  /api/v1/catalog/category:
    post:
      description: Creates a category for the tenant from the request body. Also accepts sub_categories, product_ids and tag_ids (not documented here). Call before creating items that map to it.
      operationId: catalog_createCategory
      parameters:
        - $ref: '#/components/parameters/Catalog_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              category_name: Beverages
              category_name_lang:
                en: Beverages
              category_type: 2
              description: Cold drinks and juices
              is_enabled: true
              owner_id: 1001
              sequence: 1
              type: parent
            schema:
              $ref: '#/components/schemas/Catalog_CategoryCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Catalog_CategoryCreateResult'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: Category created.
        "400":
          $ref: '#/components/responses/Catalog_BadRequest'
        "401":
          $ref: '#/components/responses/Catalog_Unauthorized'
        "500":
          $ref: '#/components/responses/Catalog_InternalError'
      summary: Create a category
      tags:
        - catalog-setup-category
  /api/v1/catalog/item:
    post:
      description: Creates an item. This file documents the product path only (entity_type 1). Map the item to a category separately before it is shown to shoppers. Tax IDs are product-only and are not used here.
      operationId: catalog_createItem
      parameters:
        - $ref: '#/components/parameters/Catalog_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              description: Sample cold drink for test data
              entity_type: 1
              is_veg: 1
              item_name: Sample Cola 330ml
              owner_id: 1001
              plu: SKU-0001
              pricing:
                cost_price: 25
                mrp: 50
                price: 40
            schema:
              $ref: '#/components/schemas/Catalog_ItemCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Catalog_ItemCreated'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: Item created.
        "400":
          $ref: '#/components/responses/Catalog_BadRequest'
        "401":
          $ref: '#/components/responses/Catalog_Unauthorized'
        "500":
          $ref: '#/components/responses/Catalog_InternalError'
      summary: Create a product (item)
      tags:
        - catalog-setup-product
  /api/v1/catalog/item/{id}:
    get:
      description: Returns one item. Optional menu_id and outlet_id scope the returned data.
      operationId: catalog_getItem
      parameters:
        - $ref: '#/components/parameters/Catalog_ItemId'
        - $ref: '#/components/parameters/Catalog_ItemMenuIdQuery'
        - $ref: '#/components/parameters/Catalog_ItemOutletIdQuery'
        - $ref: '#/components/parameters/Catalog_AcceptLanguage'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Catalog_ItemResult'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: Item detail.
        "400":
          $ref: '#/components/responses/Catalog_BadRequest'
        "401":
          $ref: '#/components/responses/Catalog_Unauthorized'
        "404":
          $ref: '#/components/responses/Catalog_NotFound'
        "500":
          $ref: '#/components/responses/Catalog_InternalError'
      summary: Get an item by UUID
      tags:
        - catalog-setup-product
    put:
      description: Updates the fields sent in the body for an existing item. Omitted fields are left unchanged.
      operationId: catalog_updateItem
      parameters:
        - $ref: '#/components/parameters/Catalog_ItemId'
        - $ref: '#/components/parameters/Catalog_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              description: Updated sample description
              item_name: Sample Cola 500ml
              pricing:
                cost_price: 28
                mrp: 55
                price: 45
            schema:
              $ref: '#/components/schemas/Catalog_ItemUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Catalog_ItemResult'
                  meta:
                    additionalProperties: true
                    type: object
                  success:
                    example: true
                    type: boolean
                type: object
          description: Item updated.
        "400":
          $ref: '#/components/responses/Catalog_BadRequest'
        "401":
          $ref: '#/components/responses/Catalog_Unauthorized'
        "404":
          $ref: '#/components/responses/Catalog_NotFound'
        "500":
          $ref: '#/components/responses/Catalog_InternalError'
      summary: Update an item
      tags:
        - catalog-setup-product
  /api/v1/catalog/item/list:
    post:
      description: Lists items for the tenant. The customer app calls this with entity_types [1], is_want_only_items true and filters.item_ids to load product cards. Total is in meta.total_count.
      operationId: catalog_listItems
      parameters:
        - $ref: '#/components/parameters/Catalog_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              current_page: 1
              entity_types:
                - 1
              filters:
                item_ids:
                  - 00000000-0000-4000-8000-000000000201
              is_want_only_items: true
              limit: 20
              previous_page: 0
            schema:
