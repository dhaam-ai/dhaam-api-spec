openapi: 3.0.1
info:
  description: |-
    Consolidated OpenAPI 3.0 specification for the DhaamAI backend services.

    Paths are full public paths (for example /api/v1/orders/...).
    Set the Apidog environment variable baseUrl and use it as the server. See specs/AUTOMATION.md
    for environments, the login flow, and the order of calls.

    Generated by merge_specs.go from the per-service files in specs/. Edit those files, not this one.
  title: Dhaam Platform API - Consolidated
  version: 2.0.0
servers:
  - description: Public API base URL (environment variable baseUrl)
    url: '{{baseUrl}}'
security:
  - bearerAuth: []
components:
  examples: {}
  headers:
    Gateway_XRequestId:
      description: Request ID, which is the trace ID. Generated by the gateway; a client-supplied value is not echoed.
      schema:
        type: string
  parameters:
    Auth_AcceptLanguage:
      description: Response language for messages. Any value other than es returns en.
      in: header
      name: Accept-Language
      required: false
      schema:
        default: en
        enum:
          - en
          - es
        type: string
    Catalog_AcceptLanguage:
      description: Send es for Spanish messages. Any other value or no header returns English.
      in: header
      name: Accept-Language
      required: false
      schema:
        example: en
        type: string
    Catalog_ItemId:
      description: Item UUID (`item_uuid`), returned by the item create call.
      in: path
      name: id
      required: true
      schema:
        example: '{{itemId}}'
        format: uuid
        type: string
    Catalog_ItemMenuIdQuery:
      description: Optional menu ID. Scopes the returned item to a menu.
      in: query
      name: menu_id
      required: false
      schema:
        format: int64
        type: integer
    Catalog_ItemOutletIdQuery:
      description: Optional outlet ID. Scopes the returned item to an outlet.
      in: query
      name: outlet_id
      required: false
      schema:
        format: int64
        type: integer
    Menu_MenuIdPath:
      description: Numeric menu id (menu_id), not the menu UUID. A non-numeric value returns 400 on create and 404 on read.
      in: path
      name: id
      required: true
      schema:
        example: 1
        format: int64
        type: integer
    Menu_MenuStatusPath:
      description: 'Status to create the menu with: 1 = active (live), 0 = inactive (draft). Any other value returns 400.'
      in: path
      name: status
      required: true
      schema:
        enum:
          - "0"
          - "1"
        example: "1"
        type: string
    Menu_ScheduleUuidPath:
      description: Schedule UUID (schedule_uuid) of one schedule row.
      in: path
      name: id
      required: true
      schema:
        example: 00000000-0000-4000-8000-000000000501
        format: uuid
        type: string
    Order_AcceptLanguage:
      description: '`es` returns Spanish messages. Any other value, or omitted, returns English.'
      in: header
      name: Accept-Language
      required: false
      schema:
        default: en
        enum:
          - en
          - es
        type: string
    Order_CustomerQuery:
      description: Customer UUID. Read by GET/DELETE /quote/{id} only. Used when the caller is not the customer.
      in: query
      name: customer_id
      required: false
      schema:
        format: uuid
        type: string
    Order_DetailField:
      description: |
        Comma-separated sections to return. Omit for all sections. Allowed values:
        `order`, `item`, `price`, `commission`, `rating`, `cancellation`.
      in: query
      name: field
      required: false
      schema:
        example: order,item
        type: string
    Order_OrderIdPath:
      description: 'Order id: the order UUID (`order.id` in the create response) or the order number (`order.order_id`). Both work.'
      in: path
      name: id
      required: true
      schema:
        example: '{{orderId}}'
        type: string
    Order_QuotationIdPath:
      description: Quotation id returned by POST /api/v1/orders/quote.
      in: path
      name: id
      required: true
      schema:
        example: '{{quotationId}}'
        format: uuid
        type: string
    Order_XTimezone:
      description: IANA timezone name, for example `Asia/Kolkata`. Used to validate scheduled times. Legacy aliases such as `Asia/Calcutta` are mapped to canonical names.
      in: header
      name: X-Timezone
      required: false
      schema:
        example: Asia/Kolkata
        type: string
    UserProfile_AcceptLanguage:
      description: Response language. en (default) or es. Any other value falls back to en.
      in: header
      name: Accept-Language
      required: false
      schema:
        default: en
        enum:
          - en
          - es
        example: en
        type: string
  requestBodies: {}
  responses:
    Catalog_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Catalog_ErrorResponse'
      description: Invalid input (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD).
    Catalog_InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Catalog_ErrorResponse'
      description: Internal error. The message is generic; details are logged server-side.
    Catalog_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Catalog_ErrorResponse'
      description: Resource not found (RESOURCE_NOT_FOUND).
    Catalog_Unauthorized:
      description: Missing or invalid bearer token.
      x-todo: Body shape of the 401 response is not verified.
    Menu_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Menu_MessageError'
      description: Invalid input, returned as {message}.
    Menu_Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Menu_MessageError'
      description: The caller's role may not write this menu's schedule, or the outlet is not resolved for the caller. Returned as {message}.
    Menu_InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Menu_MessageError'
      description: Internal error. The message is generic; details are logged server-side.
    Menu_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Menu_MessageError'
      description: Schedule or menu not found, or a lookup failed. Returned as {message}.
    Menu_Unauthorized:
      description: Missing or invalid bearer token.
      x-todo: Body shape of the 401 response is not verified.
    Profile_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile_ErrorEnvelope'
      description: Invalid request (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD).
    Profile_InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile_ErrorEnvelope'
      description: Internal error. The message is masked; no details are returned.
    Profile_Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile_ErrorEnvelope'
      description: Missing or invalid bearer token (UNAUTHORIZED).
    UserProfile_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Invalid request (INVALID_INPUT, VALIDATION_FAILED, MISSING_REQUIRED_FIELD, INVALID_UUID_FORMAT).
    UserProfile_Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Duplicate or conflicting record (DUPLICATE_ENTRY, USER_ALREADY_EXISTS).
    UserProfile_Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Access denied (ACCESS_DENIED).
    UserProfile_InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Internal error. The message is masked; no details are returned.
    UserProfile_InvalidOtp:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Invalid OTP (ACCESS_DENIED with the error message Invalid OTP). details.session holds a new session for the retry.
    UserProfile_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Resource not found.
    UserProfile_TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_RateLimitError'
      description: Rate limit exceeded. The Retry-After header and retry_after field give the wait in seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            example: 3600
            type: integer
    UserProfile_Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Missing or invalid identity (UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID, LOGIN_REQUIRED).
    UserProfile_UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfile_ErrorEnvelope'
      description: Body is not JSON (INVALID_INPUT with HTTP 415).
  schemas:
    Auth_AuthTokens:
      properties:
        access_token:
          type: string
        expires_in:
          description: Seconds until the id and access tokens expire.
          format: int32
          type: integer
        frontend_redirect_url:
          type: string
        id_token:
          description: JWT. Send as Authorization Bearer.
          type: string
        refresh_token:
          description: Can be empty when Cognito does not rotate it.
          type: string
        user:
          $ref: '#/components/schemas/Auth_AuthUser'
      type: object
    Auth_AuthTokensResponse:
      properties:
        data:
          $ref: '#/components/schemas/Auth_AuthTokens'
        meta:
          additionalProperties: true
          type: object
        success:
          example: true
          type: boolean
      required:
        - success
        - data
      type: object
    Auth_AuthUser:
      properties:
        country_code:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        is_active:
          type: boolean
        is_new_user:
          type: boolean
        is_phone_num:
          type: boolean
        is_phone_verified:
          type: boolean
        is_verified:
          type: boolean
        name:
          type: string
        phone:
          type: string
        profile_picture:
          type: string
        provider:
          type: string
        role:
          format: int64
          type: integer
        status:
          type: integer
        user_id:
          format: int64
          type: integer
        user_name:
          type: string
        username:
          description: Cognito username. Internal, do not display.
          type: string
        verification_status:
          description: 'Verification: 0 = not verified, 1 = email verified, 2 = phone verified, 3 = email and phone verified, 4 = verified by an admin.'
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          example: 1
          type: integer
      type: object
    Auth_CheckUserData:
      properties:
        exists:
          type: boolean
        is_social_only:
          type: boolean
        message:
          type: string
        roles:
          items:
            $ref: '#/components/schemas/Auth_UserExistsRole'
          type: array
        social_providers:
          items:
            type: string
          type: array
      required:
        - exists
      type: object
    Auth_CheckUserRequest:
      properties:
        country_code:
          description: Country code for phone lookups.
          example: "+1"
          type: string
        domain:
          description: Site URL or hostname. The server reduces it to the hostname.
          example: https://shop.example.com
          type: string
        identifier:
          description: Phone digits only (4 to 14) or an email address (up to 300 characters).
          example: "5550100123"
          type: string
        identifier_type:
          enum:
            - email
            - phone
          type: string
        role_id:
          description: Role id as a string. Accepted but not used by the lookup.
          example: "4"
          type: string
        tenant_id:
          description: Tenant UUID. Optional here, but the lookup needs a tenant.
          format: uuid
          type: string
        user_id:
          description: Accepted but not used by the lookup.
          type: string
      required:
        - identifier
        - identifier_type
        - domain
      type: object
    Auth_CheckUserResponse:
      properties:
        data:
          $ref: '#/components/schemas/Auth_CheckUserData'
        meta:
          additionalProperties: true
          type: object
        success:
          example: true
          type: boolean
      required:
        - success
        - data
      type: object
    Auth_DeviceInfo:
      properties:
        app_version:
          example: 1.0.0
          type: string
        device_id:
          example: 00000000-0000-4000-8000-000000000001
          type: string
        device_name:
          example: mobile
          type: string
        device_token:
          description: Optional push token.
          type: string
        device_type:
          description: Device class. The customer app sends mobile, tablet or desktop.
          example: mobile
          type: string
        ip_address:
          description: Ignored for social callback. The server uses the request's real IP.
          type: string
        os_version:
          example: ios 17.0
          type: string
        user_agent:
          example: Example User Agent
          type: string
      type: object
    Auth_ErrorInfo:
      properties:
        details:
          description: Optional. Shape depends on the error type.
        message:
          example: invalid phone number format
          type: string
        type:
          example: INVALID_INPUT
          type: string
      required:
        - type
        - message
      type: object
    Auth_ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/Auth_ErrorInfo'
        meta:
          additionalProperties: true
          type: object
        success:
          example: false
          type: boolean
      required:
        - success
        - error
      type: object
    Auth_LoginRequest:
      properties:
        password:
          description: Account password. Never log it.
          type: string
        role:
          description: 'Role id as a string: 1 = admin, 2 = merchant (store owner), 3 = manager, 4 = customer, 5 = super admin, 6 = agent, 101 = outlet user. The customer app sends "4".'
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "101"
          example: "2"
          type: string
        tenant_id:
          description: Tenant identifier used in the Cognito username.
          type: string
        user_id:
          description: User id used in the Cognito username. Required in practice.
          type: string
      required:
        - password
        - tenant_id
        - role
      type: object
    Auth_RateLimitError:
      properties:
        error:
          enum:
            - rate_limit_exceeded
          type: string
        message:
          example: Too many requests. Please try again later.
          type: string
        retry_after:
          example: 60
          type: integer
      required:
        - error
        - message
        - retry_after
      type: object
    Auth_RefreshRequest:
      properties:
        refresh_token:
          description: Refresh token from a previous login or refresh.
          type: string
        role:
          description: 'Role id as a number: 1 = admin, 2 = merchant (store owner), 3 = manager, 4 = customer, 5 = super admin, 6 = agent, 101 = outlet user. Use the same role as the login.'
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 101
          example: 4
          format: int64
          type: integer
        tenant_id:
          description: Tenant UUID. Used for the profile lookup.
          type: string
        user_id:
          description: User UUID as the customer app sends it.
          type: string
      required:
        - refresh_token
        - role
      type: object
    Auth_SocialCallbackRequest:
      properties:
        action:
          description: callback = sign in with a token the app already got from the provider (the usual case). initiate = start the provider's redirect flow.
          enum:
            - initiate
            - callback
          example: callback
          type: string
        code:
          description: Optional authorization code, if the provider flow returns one.
          type: string
        device_info:
          $ref: '#/components/schemas/Auth_DeviceInfo'
        frontend_redirect_url:
          description: Optional. Returned in the response.
          type: string
        full_name:
          description: Apple sends the name only on the first authorization. Forward it then.
          maxLength: 255
          type: string
        nonce:
          description: Nonce used in the provider authorization request.
          maxLength: 255
          type: string
        provider_token:
          description: Google or Apple id_token, or Facebook access token.
          type: string
        role:
          description: 'Role id as a string: 1 = admin, 2 = merchant (store owner), 3 = manager, 4 = customer, 5 = super admin, 6 = agent, 101 = outlet user. The customer app sends "4".'
          enum:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "101"
          example: "4"
          type: string
        state:
          description: Optional state value.
          type: string
        tenant_id:
          description: Tenant UUID. Must match the tenant registered for the request domain.
          type: string
      required:
        - action
        - tenant_id
        - role
        - provider_token
        - device_info
      type: object
    Auth_UserExistsRole:
      properties:
        id:
          format: uuid
          type: string
        role_id:
          format: int64
          type: integer
        role_name:
          type: string
        status:
          type: integer
        user_id:
          format: int64
          type: integer
        verification_status:
          description: 'Verification: 0 = not verified, 1 = email verified, 2 = phone verified, 3 = email and phone verified, 4 = verified by an admin.'
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
          example: 1
          type: integer
      type: object
    Catalog_CategoryCreateRequest:
      properties:
        business_category_id:
          example:
            - 1
          items:
            type: integer
          type: array
        category_name:
          example: Beverages
          type: string
        category_name_lang:
          additionalProperties:
            type: string
          example:
            en: Beverages
          type: object
        category_type:
          description: 1 = business category (platform level), 2 = product category (a store's own menu category). Store setup uses 2.
          enum:
            - 1
            - 2
          example: 2
          type: integer
        description:
          example: Cold drinks and juices
          type: string
        has_products:
          example: true
          type: boolean
        is_enabled:
          example: true
          type: boolean
        owner_id:
          example: 1001
          format: int64
          type: integer
        sequence:
          example: 1
          type: integer
        type:
          description: parent = a top-level category, child = a subcategory under a parent category.
          enum:
            - parent
            - child
          example: parent
          type: string
          x-todo: Allowed values for type are not enumerated in dh-catalog-service code. Confirm with the service owner.
      required:
        - type
        - category_name
        - category_type
      type: object
    Catalog_CategoryCreateResult:
      properties:
        category_id:
          example: 501
          format: int64
          type: integer
        created_at:
          example: "2026-12-01T10:00:00Z"
          format: date-time
          type: string
        id:
          example: 00000000-0000-4000-8000-000000000101
          format: uuid
          type: string
        name:
          example: Beverages
          type: string
      type: object
    Catalog_ErrorResponse:
      properties:
        error:
          properties:
            details:
              description: Present for validation errors.
            message:
              example: item_name is required
              type: string
            type:
              example: INVALID_INPUT
              type: string
          required:
            - type
            - message
          type: object
        meta:
          additionalProperties: true
          type: object
        success:
          example: false
          type: boolean
      required:
        - success
        - error
      type: object
    Catalog_ItemCreateRequest:
      properties:
        description:
          example: Sample cold drink for test data
          type: string
        entity_type:
          description: 'Item kind: 1 = product, 2 = modifier, 3 = modifier group, 4 = upsell, 5 = deal, 6 = variant, 7 = bundle. A plain product is 1.'
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
          example: 1
          type: integer
        image:
          example: https://example.com/images/sample-cola.jpg
          type: string
        is_veg:
          example: 1
          type: integer
        item_name:
          example: Sample Cola 330ml
          type: string
        item_name_lang:
          additionalProperties:
            type: string
          example:
            en: Sample Cola 330ml
          type: object
        owner_id:
          example: 1001
          format: int64
          type: integer
        plu:
          description: Item unit code, required by the service.
          example: SKU-0001
          type: string
        pricing:
          $ref: '#/components/schemas/Catalog_Pricing'
      required:
        - item_name
        - plu
        - entity_type
      type: object
    Catalog_ItemCreated:
      additionalProperties: true
      description: Shape of the created item response is not enumerated here.
      type: object
      x-todo: Create response body for POST /item is not verified in this file. Only the status code (200) and envelope are confirmed.
    Catalog_ItemListRequest:
      properties:
        current_page:
          example: 1
          minimum: 0
          type: integer
        entity_types:
          description: Entity types to return. 1 is a product.
          example:
            - 1
          items:
            type: integer
          type: array
        filters:
          description: Optional filters. The customer app sends item_ids.
          properties:
            category_id:
              format: int64
              type: integer
            item_ids:
              example:
                - 00000000-0000-4000-8000-000000000201
              items:
                type: string
              type: array
            menu_id:
              format: int64
              type: integer
            outlet_id:
              format: int64
              type: integer
            search_text:
              type: string
            status:
              enum:
                - 1
                - 2
                - 3
              type: integer
          type: object
        is_want_only_items:
          example: true
          type: boolean
        limit:
          example: 20
          minimum: 0
          type: integer
        owner_id:
          example: 1001
          format: int64
          type: integer
        previous_page:
          example: 0
          type: integer
      type: object
    Catalog_ItemListResult:
      properties:
        data:
          items:
            additionalProperties: true
            example:
              entity_type: 1
              item_name: Sample Cola 330ml
              item_uuid: 00000000-0000-4000-8000-000000000201
            type: object
          type: array
        meta:
          properties:
            is_admin_approval:
              example: false
              type: boolean
            total_count:
              example: 1
              type: integer
          type: object
        success:
          example: true
          type: boolean
      type: object
    Catalog_ItemResult:
      additionalProperties: true
      description: Item detail. Fields are returned as stored by the service.
      example:
        entity_type: 1
        item_name: Sample Cola 330ml
        item_uuid: 00000000-0000-4000-8000-000000000201
      type: object
    Catalog_ItemUpdateRequest:
      description: Send only the fields to change. Omitted fields are left unchanged.
      properties:
        description:
          example: Updated sample description
          type: string
        image:
          example: https://example.com/images/sample-cola-2.jpg
          type: string
        is_active:
          description: 1 active, 0 inactive.
          example: 1
          type: integer
        is_veg:
          example: 1
          type: integer
        item_name:
          example: Sample Cola 500ml
          type: string
        pricing:
          $ref: '#/components/schemas/Catalog_Pricing'
      type: object
    Catalog_Pricing:
      properties:
        cost_price:
          example: 25
          format: double
          type: number
        mrp:
          example: 50
          format: double
          type: number
        price:
          example: 40
          format: double
          type: number
      type: object
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              description: Error code
              type: string
            message:
              description: Human-readable error message
              type: string
          type: object
        success:
          example: false
          type: boolean
      type: object
    Gateway_ErrorEnvelope:
      description: JSON error envelope the gateway uses for non-GraphQL errors.
      properties:
        error:
          type: string
        success:
          enum:
            - false
          type: boolean
      required:
        - success
        - error
      type: object
    Gateway_GraphqlError:
      properties:
        extensions:
          properties:
            code:
              description: 'Known codes: INTERNAL_SERVER_ERROR (sanitized internal error) and SEARCH_BUSY (searchPage shed load). Other resolver errors carry no code.'
              type: string
          type: object
        locations:
          items:
            properties:
              column:
                type: integer
              line:
                type: integer
            type: object
          type: array
        message:
          description: Client-safe message. Database and connection errors are replaced with "Something went wrong. Please try again after some time." and extensions.code INTERNAL_SERVER_ERROR.
          type: string
        path:
          items:
            oneOf:
              - type: string
              - type: integer
          type: array
      required:
        - message
      type: object
    Gateway_GraphqlRequest:
      properties:
        operationName:
