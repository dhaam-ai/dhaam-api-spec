      x-todo: Also used for store settings in the storefront. This operation documents only the basic detail fields. Other fields in the same request body (preferences, is_sponsored, show_analytics_enabled, service_area_enforcement_enabled, add_user_tags, delete_user_tags, merchant_access_to_user_tags_enabled, web_domain, password, store_id) are settings or account fields and are excluded. Whether business_categories is needed for an orderable store is not confirmed.
  /api/v1/users/store/login:
    post:
      description: Logs a store (merchant) user in with email and password and returns tokens. Used to get a Bearer token for admin test-data setup. Public, no token is needed. Rate-limited.
