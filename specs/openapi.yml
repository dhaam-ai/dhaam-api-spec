  /api/v1/users/user/{identifier_type}/change:
    post:
      description: Sends an OTP to the new email or phone so the caller can change it. Then call the verify operation with the returned session. This operation sends a message to the customer's new contact, so it is rate-limited (OTP initiate limit).
      operationId: users_requestContactChangeOtp
      parameters:
        - description: 'What to change: email or phone.'
          in: path
          name: identifier_type
          required: true
          schema:
            enum:
              - email
              - phone
            example: email
            type: string
        - $ref: '#/components/parameters/UserProfile_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              identifier: new.customer@example.com
              otp_type: email_change
              provider_type: ses
            schema:
              $ref: '#/components/schemas/UserProfile_ContactChangeRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    additionalProperties: true
                    type: object
                    x-todo: The response is the usecase result (cognitoResp). Its fields are not verified; confirm before documenting them.
                  meta:
                    $ref: '#/components/schemas/UserProfile_SuccessMeta'
                  success:
                    example: true
                    type: boolean
                type: object
          description: OTP sent. The body holds the session for the verify call.
        "400":
          $ref: '#/components/responses/UserProfile_BadRequest'
        "401":
          $ref: '#/components/responses/UserProfile_Unauthorized'
        "415":
          $ref: '#/components/responses/UserProfile_UnsupportedMediaType'
        "429":
          $ref: '#/components/responses/UserProfile_TooManyRequests'
        "500":
          $ref: '#/components/responses/UserProfile_InternalError'
      security:
        - bearerAuth: []
      summary: Request an OTP to change the customer email or phone
      tags:
        - users-contact-change
      x-security-note: Sends an OTP by email or SMS. Rate-limited per identifier. Do not use real contacts in tests.
      x-todo: Response shape not verified.
  /api/v1/users/user/{identifier_type}/verify:
    post:
      description: Verifies the OTP sent by the change operation and completes the change. Call it with the session and cognito_username from the change response.
      operationId: users_verifyContactChangeOtp
      parameters:
        - description: 'What to verify: email or phone (the same as the change call).'
          in: path
          name: identifier_type
          required: true
          schema:
            enum:
              - email
              - phone
            example: email
            type: string
        - $ref: '#/components/parameters/UserProfile_AcceptLanguage'
      requestBody:
        content:
          application/json:
            example:
              cognito_username: test-user-name
              identifier: new.customer@example.com
              otp_code: "123456"
              otp_type: email_change
              role_id: 4
              session: test-session-token
            schema:
              $ref: '#/components/schemas/UserProfile_ContactVerifyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  data:
                    example: OTP verified
                    type: string
                  meta:
                    $ref: '#/components/schemas/UserProfile_SuccessMeta'
                  success:
