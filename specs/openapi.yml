        "401":
          $ref: '#/components/responses/Catalog_Unauthorized'
        "500":
          $ref: '#/components/responses/Catalog_InternalError'
      summary: List items with pagination and filters
      tags:
        - catalog-setup-product
        - catalog-customer-browse
